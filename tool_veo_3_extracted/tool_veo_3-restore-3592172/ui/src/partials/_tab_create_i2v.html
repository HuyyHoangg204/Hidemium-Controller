<!-- TAB: IMAGE TO VIDEO (I2V) — REDESIGNED -->
<div x-cloak x-show="activeMenu === 'create_i2v'" class="max-w-5xl mx-auto px-2 pr-4">

    <!-- Hero header -->
    <div class="relative rounded-2xl overflow-hidden mb-10 border border-blue-100 bg-white shadow-sm">

        <div class="relative px-7 py-6 flex items-center gap-5">
            <div class="w-14 h-14 rounded-2xl bg-blue-100 flex items-center justify-center shrink-0 shadow-sm ml-5"
                style="margin-left: 20px;">
                <i class="fa-solid fa-photo-film text-blue-600 text-2xl"></i>
            </div>
            <div class="flex-1">
                <h3 class="text-slate-900 font-black text-xl tracking-tight">
                    Video từ Ảnh (I2V)</h3>
                <p class="text-slate-500 text-[13px] mt-1">Upload ảnh → Veo 3
                    tự động tạo video chuyển động</p>
            </div>
            <div class="hidden md:flex items-center gap-2 bg-blue-50 border border-blue-200 rounded-xl px-4 py-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-blue-700 text-[12px] font-semibold">Veo
                    3.1 Ready</span>
            </div>
        </div>
    </div>

    <form @submit.prevent="createI2V" class="grid grid-cols-1 lg:grid-cols-5 gap-6">

        <!-- LEFT COLUMN: Config -->
        <div class="lg:col-span-3 flex flex-col gap-8">

            <!-- Project card -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-7 py-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/60">
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 bg-blue-100 rounded-md flex items-center justify-center"
                            style="margin-left: 20px;">
                            <i class="fa-solid fa-folder text-blue-500 text-[11px]"></i>
                        </div>
                        <span class="text-[13px] font-bold text-slate-700">Dự
                            Án</span>
                    </div>
                    <button type="button" @click="loadProjects()"
                        class="text-[11px] text-blue-500 font-semibold hover:text-blue-700 flex items-center gap-1 transition-colors">
                        <i class="fa-solid fa-rotate-right"></i> Làm mới
                    </button>
                </div>
                <div class="p-5 space-y-5">
                    <div class="relative">
                        <select x-model="i2vForm.project_id"
                            class="pl-5 w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:bg-white focus:border-blue-400 focus:ring-2 focus:ring-blue-100 outline-none appearance-none cursor-pointer transition-all">
                            <option value="NEW" class="font-bold text-blue-600">
                                Tạo Dự Án Mới
                            </option>
                            <template x-for="p in projects" :key="p.id">
                                <option :value="p.id" x-text="p.name">
                                </option>
                            </template>
                        </select>

                    </div>
                    <input x-show="i2vForm.project_id === 'NEW'" x-model="i2vForm.new_project_name" type="text"
                        placeholder="Tên dự án mới..."
                        class="w-full border border-blue-200 bg-blue-50/20 rounded-xl px-4 py-3 text-sm focus:border-blue-400 focus:ring-2 focus:ring-blue-100 outline-none transition-all">
                </div>
            </div>

            <!-- Mode card -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-5 py-5 border-b border-slate-100 bg-slate-50/60 flex items-center gap-2">
                    <div class="w-6 h-6 bg-violet-100 rounded-md flex items-center justify-center">
                        <i class="fa-solid fa-sliders text-violet-600 text-[11px]"></i>
                    </div>
                    <span class="text-[13px] font-bold text-slate-700 mt-3 mb-3" style="margin-top: 12px;">
                        Chế độ tạo video</span>
                </div>
                <div class="p-6 grid grid-cols-2 gap-3">
                    <label class="relative cursor-pointer">
                        <input type="radio" x-model="i2vForm.mode" value="multi" class="sr-only">
                        <div class="rounded-xl border-2 p-4 transition-all"
                            :class="i2vForm.mode === 'multi' ? 'border-blue-500 bg-gradient-to-br from-blue-50 to-blue-100/50 shadow-sm' : 'border-slate-200 hover:border-blue-300 bg-slate-50'">
                            <div class="text-2xl mb-2">🎬</div>
                            <p class="text-[13px] font-bold text-slate-800">
                                Mỗi ảnh → 1 video</p>
                            <p class="text-[11px] text-slate-500 mt-0.5">N
                                ảnh = N video song song</p>
                            <template x-if="i2vForm.mode === 'multi'">
                                <span class="mt-3 text-white text-[10px] font-bold px-3 py-1.5 rounded-full"
                                    style="background:#2563eb;display:inline-block;width:fit-content">
                                    ✓ Đang chọn
                                </span>
                            </template>
                        </div>
                    </label>
                    <label class="relative cursor-pointer">
                        <input type="radio" x-model="i2vForm.mode" value="frames" class="sr-only">
                        <div class="rounded-xl border-2 p-4 transition-all"
                            :class="i2vForm.mode === 'frames' ? 'border-blue-500 bg-gradient-to-br from-blue-50 to-blue-100/50 shadow-sm' : 'border-slate-200 hover:border-blue-300 bg-slate-50'">
                            <div class="text-2xl mb-2">🎞</div>
                            <p class="text-[13px] font-bold text-slate-800">
                                Đầu + Cuối → 1 video</p>
                            <p class="text-[11px] text-slate-500 mt-0.5">2
                                ảnh làm start &amp; end</p>
                            <template x-if="i2vForm.mode === 'frames'">
                                <span class="mt-3 text-white text-[10px] font-bold px-3 py-1.5 rounded-full"
                                    style="background:#2563eb;display:inline-block;width:fit-content">
                                    ✓ Đang chọn
                                </span>
                            </template>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Settings card -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-5 py-5 border-b border-slate-100 bg-slate-50/60 flex items-center gap-2">
                    <div class="w-6 h-6 bg-emerald-100 rounded-md flex items-center justify-center"
                        style="margin-bottom: 20px;margin-top: 20px;">
                        <i class="fa-solid fa-gear text-emerald-600 text-[11px]"></i>
                    </div>
                    <span class="text-[13px] font-bold text-slate-700">
                        Cài đặt
                    </span>
                </div>
                <div class="p-6 space-y-6">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label
                                class="block text-[12px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">Model</label>
                            <div class="relative">
                                <select x-model="i2vForm.model"
                                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-5 py-2.5 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none appearance-none transition-all">
                                    <option value="VEO_3.1_I2V_FAST">Veo3.1 Fast Lower</option>
                                    <option value="VEO_3.1_I2V_QUALITY"> Veo3.1 Quality</option>
                                </select>

                            </div>
                        </div>
                        <div>
                            <label
                                class="block text-[12px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">
                                Tỉ lệ</label>
                            <div class="relative">
                                <select x-model="i2vForm.screen_ratio"
                                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-5 py-2.5 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none appearance-none transition-all">
                                    <option value="16:9"> 16:9 Landscape
                                    </option>
                                    <option value="9:16"> 9:16 Portrait
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[12px] font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">
                            Prompt <span class="normal-case text-slate-400 font-normal">(tuy
                                chon)</span>
                        </label>
                        <textarea x-model="i2vForm.prompt" rows="3"
                            placeholder="Mo ta chuyen dong: camera zoom in slowly, character walks forward..."
                            class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none resize-none placeholder-slate-400 bg-slate-50 focus:bg-white transition-all"></textarea>
                    </div>
                    <div class="border-t border-slate-100 pt-4">
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-[12px] font-semibold text-slate-600 uppercase tracking-wider">Nhap tu Excel</label>
                            <label class="px-3 py-1.5 bg-white hover:bg-slate-50 text-slate-700 cursor-pointer rounded-md text-[12px] font-semibold border border-slate-200 shadow-sm transition-colors flex items-center gap-1.5">
                                Chon file .xlsx
                                <input type="file" class="hidden" accept=".xlsx,.xls" @change="handleI2VExcelImport($event)">
                            </label>
                        </div>
                        <div x-show="i2vForm.excelTasks && i2vForm.excelTasks.length > 0" class="bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2 text-[12px] text-emerald-700 font-medium flex items-center justify-between">
                            <span x-text="'Da doc ' + i2vForm.excelTasks.length + ' dong tu Excel'"></span>
                            <button type="button" @click="i2vForm.excelTasks = []; i2vForm.excelImportName = ''" class="text-red-500 hover:text-red-700 text-[11px] font-bold">Xoa</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Image upload -->
        <div class="lg:col-span-2 flex flex-col gap-6">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex-1">
                <div class="px-5 py-5 border-b border-slate-100 bg-slate-50/60 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 bg-orange-100 rounded-md flex items-center justify-center">
                            <i class="fa-solid fa-images text-orange-500 text-[11px]"></i>
                        </div>
                        <span class="text-[13px] font-bold text-slate-700">
                            Ảnh đầu vào
                            <span x-show="i2vForm.mode === 'frames'" class="text-violet-600">(start →
                                end)</span>
                            <span x-show="i2vForm.mode === 'multi'" class="text-indigo-600">(mỗi
                                ảnh/video)</span>
                        </span>
                    </div>
                    <span class="text-[11px] font-bold px-2.5 py-1 rounded-full"
                        :class="i2vForm.image_files.length > 0 ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-500'"
                        x-text="i2vForm.image_files.length + ' / ' + (i2vForm.mode === 'frames' ? '2' : '10')">
                    </span>
                </div>
                <div class="p-5 flex flex-col gap-4 h-full">
                    <!-- Thumbnails -->
                    <div x-show="i2vForm.image_files.length > 0" class="grid grid-cols-3 gap-2">
                        <template x-for="(f, idx) in i2vForm.image_files" :key="idx">
                            <div class="relative group aspect-square rounded-xl overflow-hidden border-2 shadow-sm transition-all hover:scale-105"
                                :class="i2vForm.mode === 'frames' && idx === 0 ? 'border-indigo-400' : i2vForm.mode === 'frames' && idx === 1 ? 'border-violet-400' : 'border-slate-200'">
                                <img :src="f.preview" class="w-full h-full object-cover">
                                <!-- Frame label -->
                                <div x-show="i2vForm.mode === 'frames' && idx === 0"
                                    class="absolute top-0 inset-x-0 bg-indigo-600/90 text-white text-[9px] font-black text-center py-0.5">
                                    START</div>
                                <div x-show="i2vForm.mode === 'frames' && idx === 1"
                                    class="absolute top-0 inset-x-0 bg-violet-600/90 text-white text-[9px] font-black text-center py-0.5">
                                    END</div>
                                <!-- Delete btn -->
                                <button type="button" @click="i2vForm.image_files = i2vForm.image_files.filter((_, i) => i !== idx)"
                                    class="absolute bottom-1 right-1 w-6 h-6 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center opacity-80 hover:opacity-100 transition-all shadow-md hover:bg-red-600">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                                <!-- Index badge -->
                                <div x-show="i2vForm.mode === 'multi'"
                                    class="absolute bottom-1 left-1 bg-black/60 text-white text-[9px] font-bold px-1.5 py-0.5 rounded"
                                    x-text="'#' + (idx + 1)"></div>
                            </div>
                        </template>
                    </div>

                    <!-- Drop zone -->
                    <label
                        class="flex-1 flex flex-col items-center justify-center gap-3 border-2 border-dashed rounded-2xl px-4 py-8 cursor-pointer transition-all min-h-[160px]"
                        :class="i2vForm.image_files.length > 0 ? 'border-blue-200 bg-blue-50/40 hover:bg-blue-50' : 'border-slate-300 bg-slate-50/80 hover:border-blue-400 hover:bg-blue-50/30'">
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center transition-colors"
                            :class="i2vForm.image_files.length > 0 ? 'bg-blue-100' : 'bg-slate-100'">
                            <i class="fa-solid fa-cloud-arrow-up text-xl transition-colors"
                                :class="i2vForm.image_files.length > 0 ? 'text-blue-500' : 'text-slate-400'"></i>
                        </div>
                        <div class="text-center">
                            <p class="text-sm font-bold text-slate-700">Chọn
                                hoặc thả ảnh</p>
                            <p class="text-[11px] text-slate-400 mt-0.5">
                                JPG, PNG, WEBP · tối đa <span x-text="i2vForm.mode === 'frames' ? '2' : '10'"></span>
                                ảnh
                            </p>
                        </div>
                        <input type="file" class="hidden" multiple accept="image/jpeg,image/png,image/webp"
                            @change="handleI2VFilePick($event)">
                    </label>
                </div>
            </div>

            <!-- Submit button -->
            <button type="submit" :disabled="i2vCreating || (i2vForm.image_files.length === 0 && (!i2vForm.excelTasks || i2vForm.excelTasks.length === 0))"
                class="w-full py-4 font-black rounded-2xl text-[15px] transition-all flex items-center justify-center gap-3 shadow-lg hover:brightness-110 active:scale-[.98] disabled:opacity-50 disabled:cursor-not-allowed"
                style="background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff">
                <i :class="i2vCreating ? 'fa-solid fa-circle-notch fa-spin' : 'fa-solid fa-wand-magic-sparkles'"></i>
                <span x-text="i2vCreating ? 'Đang gửi tác vụ...' : 'Tạo Video từ Ảnh'">Tạo
                    Video từ Ảnh</span>
            </button>

            <!-- Info hint -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-[12px] text-slate-500 flex gap-2.5">
                <i class="fa-solid fa-circle-info text-indigo-400 mt-0.5 shrink-0"></i>
                <span>Video sẽ được tạo trên Google Veo 3. Kết quả sẽ xuất
                    hiện trong <strong class="text-slate-700">Video
                        Gallery</strong> sau vài phút.</span>
            </div>
        </div>
    </form>
</div>
