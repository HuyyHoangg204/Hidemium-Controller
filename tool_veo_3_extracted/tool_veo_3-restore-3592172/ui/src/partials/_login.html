    <!-- MAIN APP LAYOUT -->
    <div class="app-login min-h-screen flex items-center justify-center p-4 relative overflow-hidden" x-cloak
        x-show="!isLoggedIn">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary/20 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-accent/20 rounded-full blur-[100px]"></div>

        <div class="glass-panel p-8 rounded-2xl w-full max-w-md relative z-10 shadow-2xl border-t border-slate-200">
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 bg-gradient-to-tr from-primary to-accent rounded-xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-primary/20">
                    <i class="fa-solid fa-robot text-3xl text-slate-900"></i>
                </div>
                <h1
                    class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                    API Veo 3 Portal</h1>
                <p class="text-slate-500 mt-2 text-sm">Hệ thống quản trị tài khoản & Video</p>
            </div>

            <form @submit.prevent="login" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-500 mb-1">Tên đăng nhập</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-slate-500"></i>
                        </div>
                        <input x-model="loginForm.username" type="text" required
                            class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-lg focus:ring-2 focus:ring-indigo-500 block pl-10 p-2.5 outline-none"
                            placeholder="Nhập username...">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-500 mb-1">Mật khẩu</label>
                    <div class="relative" x-data="{ showPassword: false }">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-500"></i>
                        </div>
                        <input x-model="loginForm.password" :type="showPassword ? 'text' : 'password'" required
                            class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-lg focus:ring-2 focus:ring-indigo-500 block pl-10 pr-10 p-2.5 outline-none"
                            placeholder="Nhập mật khẩu...">
                        <button type="button" @click="showPassword = !showPassword"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i class="fa-solid" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" :disabled="loading"
                    class="w-full text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 font-medium rounded-lg px-5 py-3 flex justify-center items-center gap-2 shadow-lg disabled:opacity-50">
                    <i class="fa-solid fa-arrow-right-to-bracket" x-show="!loading"></i>
                    <i class="fa-solid fa-circle-notch fa-spin" x-cloak x-show="loading"></i>
                    <span>Đăng Nhập</span>
                </button>
            </form>
        </div>
    </div>
    </div>
