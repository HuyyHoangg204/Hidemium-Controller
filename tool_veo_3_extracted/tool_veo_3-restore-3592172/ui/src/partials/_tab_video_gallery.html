<!-- TAB: VIDEO GALLERY -->
<style>
    /* Fix UI shift when hover expands prompt popover and triggers scrollbar */
    main.overflow-y-auto {
        scrollbar-gutter: stable;
        overflow-y: scroll !important;
    }
</style>
<div x-cloak x-show="activeMenu === 'video_gallery'" class="max-w-6xl mx-auto">
    <div x-show="!selectedProjectId"
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-8 transition-all">
        <div class="mb-4 sm:mb-0">
            <h3 class="text-xl font-bold text-slate-900 tracking-tight">Thư viện Video
                System</h3>
            <p class="text-[13px] text-slate-500 mt-1">Quản lý và theo dõi tiến trình tạo
                video hàng
                loạt từ Google Veo.</p>
        </div>
        <button @click="loadVideos()"
            class="bg-white hover:bg-slate-50 text-slate-700 font-semibold px-4 py-2.5 rounded-lg border border-slate-200 shadow-sm transition-colors text-[13px] flex items-center gap-2">
            <i class="fa-solid fa-arrows-rotate text-slate-400" :class="{'fa-spin text-indigo-500': videoLoading}"></i>
            Làm mới dữ liệu
        </button>
    </div>

    <div class="space-y-8">
        <template x-if="videoLoading && videos.length === 0 && projects.length === 0">
            <div
                class="py-16 flex flex-col items-center justify-center text-slate-500 bg-white rounded-xl border border-slate-200 border-dashed">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-500 mb-4"></i>
                <span class="text-sm font-medium">Đang tải dữ liệu thư viện hệ
                    thống...</span>
            </div>
        </template>
        <template x-if="!videoLoading && projects.length === 0">
            <div
                class="py-16 flex flex-col items-center justify-center text-slate-500 bg-white rounded-xl border border-slate-200 border-dashed">
                <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-folder-open text-2xl text-slate-400"></i>
                </div>
                <h4 class="text-slate-900 font-bold mb-1">Chưa có dự án nào</h4>
                <p class="text-[13px]">Hãy sử dụng tab "Video Studio" để tạo video mới.</p>
            </div>
        </template>

        <!-- Project Grid View (Level 1) -->
        <div x-show="!selectedProjectId" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="p in projects" :key="p.id">
                <div @click="videos = []; filterStatus = 'ALL'; pagination.page = 1; selectedProjectId = p.id; loadVideos(1)"
                    class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-300 transition-all cursor-pointer relative group flex flex-col h-full">
                    <!-- Status indicator line -->
                    <div
                        class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-violet-500 rounded-t-2xl opacity-50 group-hover:opacity-100 transition-opacity">
                    </div>

                    <div class="flex-1">
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold text-[16px] text-slate-800 tracking-tight leading-tight line-clamp-2"
                                x-text="p.name"></h4>
                        </div>
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-6">
                            <i class="fa-regular fa-clock mr-1"></i> <span
                                x-text="new Date(p.created_at * 1000).toLocaleString('vi-VN')"></span>
                        </p>
                    </div>

                    <div class="mt-auto">
                        <div class="grid grid-cols-5 gap-2 mb-4">
                            <div class="bg-slate-50 rounded-lg p-2 text-center border border-slate-100">
                                <div class="text-[10px] text-slate-500 font-semibold uppercase mb-0.5">
                                    Tổng</div>
                                <div class="text-sm font-bold text-slate-700" x-text="p.total_videos || 0">
                                </div>
                            </div>
                            <div class="bg-emerald-50 rounded-lg p-2 text-center border border-emerald-100">
                                <div class="text-[10px] text-emerald-600 font-semibold uppercase mb-0.5">
                                    Success</div>
                                <div class="text-sm font-bold text-emerald-700"
                                    x-text="p.completed_images_count !== undefined ? p.completed_images_count : p.completed_count || 0">
                                </div>
                            </div>
                            <div class="bg-red-50 rounded-lg p-2 text-center border border-red-100">
                                <div class="text-[10px] text-red-500 font-semibold uppercase mb-0.5">
                                    Fail</div>
                                <div class="text-sm font-bold text-red-600" x-text="p.failed_count || 0">
                                </div>
                            </div>
                            <div class="bg-amber-50 rounded-lg p-2 text-center border border-amber-100">
                                <div class="text-[10px] text-amber-500 font-semibold uppercase mb-0.5">
                                    Wait</div>
                                <div class="text-sm font-bold text-amber-600" x-text="p.pending_count || 0">
                                </div>
                            </div>
                            <div class="bg-slate-100 rounded-lg p-2 text-center border border-slate-200">
                                <div class="text-[10px] text-slate-500 font-semibold uppercase mb-0.5">
                                    Paused</div>
                                <div class="text-sm font-bold text-slate-600" x-text="p.paused_count || 0">
                                </div>
                            </div>
                        </div>

                        <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden relative">
                            <div class="bg-indigo-500 h-full transition-all duration-1000 ease-out"
                                :style="`width: ${Math.min(100, ((p.completed_images_count !== undefined ? p.completed_images_count : p.completed_count || 0) / (p.total_videos || 1)) * 100)}%`">
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Project Detail View (Level 2) -->
        <div x-show="selectedProjectId" x-transition.opacity style="display: none;">
            <template x-if="selectedProjectId">
                <div>
                    <!-- Back button & Header -->
                    <div class="mb-6 flex flex-col md:flex-row items-start md:items-center gap-4">
                        <!-- Header Buttons Group -->
                        <div class="flex flex-col sm:flex-row gap-2 flex-wrap">
                            <button @click="selectedProjectId = null; loadProjects()"
                                class="bg-white hover:bg-slate-50 text-slate-600 px-4 py-3 md:py-2.5 rounded-xl border border-slate-200 shadow-sm transition-colors text-[13px] font-semibold flex items-center justify-center gap-2">
                                <i class="fa-solid fa-arrow-left"></i> Trở về
                            </button>
                            <button style="color: red;" @click="deleteProject(selectedProjectId)" x-show="isAdmin"
                                class="bg-white hover:bg-red-50 text-red-500 px-4 py-3 md:py-2.5 rounded-xl border border-slate-200 shadow-sm transition-colors text-[13px] font-semibold flex items-center justify-center gap-2">
                                <i class="fa-solid fa-trash-can"></i> Xoá Dự án
                            </button>
                            <button @click="downloadProject(selectedProjectId)"
                                class="bg-white hover:bg-emerald-50 text-emerald-600 px-4 py-3 md:py-2.5 rounded-xl border border-slate-200 shadow-sm transition-colors text-[13px] font-semibold flex items-center justify-center gap-2"
                                title="Tải xuống tất cả video (ZIP)">
                                <i class="fa-solid fa-download"></i> Tải xuống
                            </button>
                            <!-- Retry All Failed & Wait & Paused -->
                            <button @click="retryProject(selectedProjectId)"
                                x-show="(projects.find(p => p.id === selectedProjectId) || {}).failed_count > 0 || (projects.find(p => p.id === selectedProjectId) || {}).pending_count > 0 "
                                :disabled="retryingProject"
                                class="bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-white px-4 py-3 md:py-2.5 rounded-xl border border-amber-400 shadow-sm transition-colors text-[13px] font-semibold flex items-center justify-center gap-2"
                                title="Retry toàn bộ task FAIL và đang CHỜ trong dự án">
                                <i class="fa-solid fa-rotate-right" :class="retryingProject ? 'fa-spin' : ''"></i>
                                <span style="color: aqua;"
                                    x-text="retryingProject ? 'Đang xử lý...' : 'Retry Fail & Wait'"></span>
                                <span style="color: gold;"
                                    class="bg-white/30 text-gold text-[10px] font-bold px-1.5 py-0.5 rounded-full"
                                    x-text="((projects.find(p => p.id === selectedProjectId) || {}).failed_count || 0) + ((projects.find(p => p.id === selectedProjectId) || {}).pending_count || 0)"></span>
                            </button>
                            <!-- Retry All Tasks From Scratch -->
                            <button @click="retryProjectAll(selectedProjectId)"
                                x-show="((projects.find(p => p.id === selectedProjectId) || {}).total_videos || 0) > 0"
                                :disabled="retryingProjectAll"
                                class="bg-rose-600 hover:bg-rose-700 disabled:opacity-50 text-white px-4 py-3 md:py-2.5 rounded-xl border border-rose-500 shadow-sm transition-colors text-[13px] font-semibold flex items-center justify-center gap-2"
                                title="Reset toàn bộ task trong project về mới tinh và chạy lại từ đầu">
                                <i class="fa-solid fa-broom" :class="retryingProjectAll ? 'fa-spin' : ''"></i>
                                <span style="color: white;"
                                    x-text="retryingProjectAll ? 'Đang reset...' : 'Retry tất cả task'"></span>
                                <span style="color: white;"
                                    class="bg-white/25 text-[10px] font-bold px-1.5 py-0.5 rounded-full"
                                    x-text="(projects.find(p => p.id === selectedProjectId) || {}).total_videos || 0"></span>
                            </button>
                            <!-- Retry Fail & Wait (Hôm nay) -->
                            <button @click="retryProjectToday(selectedProjectId)"
                                x-show="(projects.find(p => p.id === selectedProjectId) || {}).failed_count > 0 || (projects.find(p => p.id === selectedProjectId) || {}).pending_count > 0 "
                                :disabled="retryingProjectToday"
                                class="bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 px-4 py-3 md:py-2.5 rounded-xl border border-emerald-400 shadow-sm transition-colors text-[13px] font-semibold flex items-center justify-center gap-2"
                                title="Retry chỉ các task FAIL/Wait trong NGÀY HÔM NAY">
                                <i class="fa-solid fa-calendar-check"
                                    :class="retryingProjectToday ? 'fa-spin' : ''"></i>
                                <span style="color: black;"
                                    x-text="retryingProjectToday ? 'Đang xử lý...' : 'Retry Fail & Wait (Hôm nay)'"></span>
                                <span style="color: black;"
                                    class="bg-white/30 text-[10px] font-bold px-1.5 py-0.5 rounded-full"
                                    x-text="((projects.find(p => p.id === selectedProjectId) || {}).failed_count || 0) + ((projects.find(p => p.id === selectedProjectId) || {}).pending_count || 0)"></span>
                            </button>

                            <!-- Resume All Paused -->
                            <button @click="resumePausedProject(selectedProjectId)"
                                x-show="((projects.find(p => p.id === selectedProjectId) || {}).paused_count || 0) > 0"
                                :disabled="resumingPaused"
                                class="bg-indigo-500 hover:bg-indigo-600 disabled:opacity-50 text-white px-4 py-3 md:py-2.5 rounded-xl border border-indigo-400 shadow-sm transition-colors text-[13px] font-semibold flex items-center justify-center gap-2"
                                title="Resume toàn bộ task PAUSED trong dự án">
                                <i class="fa-solid fa-play" :class="resumingPaused ? 'fa-spin' : ''"></i>
                                <span x-text="resumingPaused ? 'Đang resume...' : 'Resume Paused'"></span>
                                <span class="bg-white/30 text-[10px] font-bold px-1.5 py-0.5 rounded-full"
                                    x-text="(projects.find(p => p.id === selectedProjectId) || {}).paused_count || 0"></span>
                            </button>

                            <!-- Replace Concurrency Control with Pause Pending button -->
                            <div class="flex items-center gap-2">
                                <button @click="pausePendingProject(selectedProjectId)"
                                    class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg border border-red-500 shadow-sm transition-colors text-[13px] font-semibold flex items-center gap-2"
                                    title="Tạm dừng tất cả task đang PENDING trong dự án">
                                    <i class="fa-solid fa-pause"></i> <span style="color: blue;">Tạm dừng pending</span>
                                </button>
                                <span class="text-[12px] text-slate-500">Pending:</span>
                                <span class="text-[12px] font-bold text-amber-600"
                                    x-text="(projects.find(p => p.id === selectedProjectId) || {}).pending_count || 0"></span>
                            </div>
                        </div>

                        <div
                            class="flex-1 w-full bg-white px-5 py-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4 flex-wrap">
                            <div>
                                <h4 class="font-bold text-lg text-slate-800 tracking-tight"
                                    x-text="(projects.find(p => p.id === selectedProjectId) || {}).name">
                                </h4>
                                <div class="text-[12px] text-slate-500 mt-0.5 font-medium">Chi tiết các
                                    phân cảnh Video trong dự án</div>
                                <!-- Project Start / End Time -->
                                <div class="mt-1.5" x-data="{
                                    label: '',
                                    timeText: '',
                                    isDone: false,
                                    _timer: null,
                                    formatDateTime(ts) {
                                        if (!ts) return '—';
                                        return new Date(Math.floor(ts) * 1000).toLocaleString('vi-VN');
                                    },
                                    update() {
                                        const proj = (projects || []).find(p => p.id === selectedProjectId);
                                        if (!proj) return;
                                        const total = proj.total_videos || 0;
                                        const completed = proj.completed_images_count !== undefined ? proj.completed_images_count : (proj.completed_count || 0);
                                        const failed = proj.failed_count || 0;
                                        const pending = proj.pending_count || 0;
                                        const paused = proj.paused_count || 0;
                                        this.isDone = total > 0 && pending === 0 && paused === 0 && (completed + failed) >= total;

                                        if (this.isDone) {
                                            const ended = Math.floor(proj.finished_at || proj.updated_at || proj.created_at || Date.now() / 1000);
                                            this.label = 'Kết thúc:';
                                            this.timeText = this.formatDateTime(ended);
                                        } else {
                                            // started_at được backend reset/cập nhật theo lần batch/retry đang chạy.
                                            // Nếu chưa có thì fallback created_at để vẫn có mốc bắt đầu rõ ràng.
                                            const started = Math.floor(proj.started_at || proj.created_at || Date.now() / 1000);
                                            this.label = 'Start time:';
                                            this.timeText = this.formatDateTime(started);
                                        }
                                    }
                                }" x-init="update(); _timer = setInterval(() => update(), 1000)" x-effect="update()"
                                    @project-timer-cleanup.window="clearInterval(_timer)">
                                    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border"
                                        :class="isDone ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-blue-50 text-blue-700 border-blue-200'">
                                        <i class="text-[11px]"
                                            :class="isDone ? 'fa-solid fa-circle-check text-emerald-500' : 'fa-solid fa-clock text-blue-500 animate-pulse'"></i>
                                        <span class="text-[11px] font-bold" x-text="label"></span>
                                        <span class="text-[12px] font-mono font-bold" x-text="timeText"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="flex gap-4 items-center">
                                <div class="flex gap-3">
                                    <div class="text-center">
                                        <div
                                            class="text-[10px] text-emerald-600 font-bold uppercase mb-0.5 tracking-wider">
                                            Success
                                        </div>
                                        <div class="text-[13px] font-bold text-emerald-700"
                                            x-text="(projects.find(p => p.id === selectedProjectId) || {}).completed_images_count !== undefined ? (projects.find(p => p.id === selectedProjectId) || {}).completed_images_count : (projects.find(p => p.id === selectedProjectId) || {}).completed_count || 0">
                                        </div>
                                    </div>
                                    <div class="w-px h-8 bg-slate-200 mt-1"></div>
                                    <div class="text-center">
                                        <div class="text-[10px] text-red-500 font-bold uppercase mb-0.5 tracking-wider">
                                            Fail</div>
                                        <div class="text-[13px] font-bold text-red-600"
                                            x-text="(projects.find(p => p.id === selectedProjectId) || {}).failed_count || 0">
                                        </div>
                                    </div>
                                    <div class="w-px h-8 bg-slate-200 mt-1"></div>
                                    <div class="text-center">
                                        <div
                                            class="text-[10px] text-amber-500 font-bold uppercase mb-0.5 tracking-wider">
                                            Wait</div>
                                        <div class="text-[13px] font-bold text-amber-600"
                                            x-text="(projects.find(p => p.id === selectedProjectId) || {}).pending_count || 0">
                                        </div>
                                    </div>
                                    <div class="w-px h-8 bg-slate-200 mt-1"></div>
                                    <div class="text-center"
                                        x-show="((projects.find(p => p.id === selectedProjectId) || {}).paused_count || 0) > 0">
                                        <div
                                            class="text-[10px] text-slate-500 font-bold uppercase mb-0.5 tracking-wider">
                                            Paused</div>
                                        <div class="text-[13px] font-bold text-slate-600"
                                            x-text="(projects.find(p => p.id === selectedProjectId) || {}).paused_count || 0">
                                        </div>
                                    </div>
                                </div>

                                <div class="hidden md:block w-px h-8 bg-slate-200 ml-2">
                                </div>

                                <div class="w-full md:w-48 ml-2">
                                    <div class="flex justify-between items-end mb-1.5">
                                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Tiến
                                            độ tổng</span>
                                        <span class="text-[11px] text-indigo-700 font-bold"
                                            x-text="`${ (projects.find(p => p.id === selectedProjectId) || {}).completed_images_count !== undefined ? (projects.find(p => p.id === selectedProjectId) || {}).completed_images_count : (projects.find(p => p.id === selectedProjectId) || {}).completed_count || 0} / ${(projects.find(p => p.id === selectedProjectId) || {}).total_videos || 1}`">
                                        </span>
                                    </div>
                                    <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                                        <div class="bg-indigo-500 h-full transition-all duration-1000"
                                            :style="`width: ${Math.min(100, (((projects.find(p => p.id === selectedProjectId) || {}).completed_images_count !== undefined ? (projects.find(p => p.id === selectedProjectId) || {}).completed_images_count : (projects.find(p => p.id === selectedProjectId) || {}).completed_count || 0) / ((projects.find(p => p.id === selectedProjectId) || {}).total_videos || 1)) * 100)}%`">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Header cho Grid & Search -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                        <h5 class="text-sm font-bold text-slate-700 uppercase tracking-widest">
                            <i class="fa-solid fa-list-ul mr-2"></i> Danh sách Video
                        </h5>

                        <select x-model="filterStatus" @change="loadVideos(1)"
                            class="appearance-none bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 block pl-3 pr-8 p-2 font-medium outline-none cursor-pointer">
                            <option value="ALL">Tất cả</option>
                            <option value="COMPLETED">✅ Pass</option>
                            <option value="FAILED">❌ Fail</option>
                            <option value="PENDING">⏳ Wait</option>
                            <option value="PAUSED">⏸ Paused</option>
                        </select>
                        <div
                            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                            <i class="fa-solid fa-chevron-down text-[10px]"></i>
                        </div>
                    </div>

                    <!-- Filter Row: Date + Media Type + Page Size -->
                    <div class="flex flex-col sm:flex-row gap-3 mb-4 items-start sm:items-center flex-wrap">
                        <!-- Lọc theo ngày -->
                        <div class="flex items-center gap-2">
                            <label class="text-xs font-semibold text-slate-500 whitespace-nowrap">
                                <i class="fa-solid fa-calendar-day mr-1"></i>Từ ngày:
                            </label>
                            <input type="date" x-model="filterDate" @change="loadVideos(1)"
                                class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 px-3 py-1.5 font-medium outline-none" />
                            <button x-show="filterDate" @click="filterDate = ''; loadVideos(1)"
                                class="text-xs text-red-500 hover:text-red-700 font-semibold px-2 py-1 rounded-md border border-red-200 hover:bg-red-50 transition-colors"
                                title="Xóa bộ lọc ngày">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <!-- Lọc loại media: Tất cả / Video / Ảnh -->
                        <div class="flex gap-2 bg-slate-100 rounded-lg p-1 shrink-0">
                            <button @click="filterMediaType = 'ALL'; loadVideos(1)"
                                class="px-5 py-2 rounded-md text-xs font-semibold transition-all"
                                :class="filterMediaType === 'ALL' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'">
                                Tất cả
                            </button>
                            <button @click="filterMediaType = 'VIDEO'; loadVideos(1)"
                                class="px-5 py-2 rounded-md text-xs font-semibold transition-all"
                                :class="filterMediaType === 'VIDEO' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'">
                                <i class="fa-solid fa-video text-[10px] mr-1"></i>Video
                            </button>
                            <button @click="filterMediaType = 'IMAGE'; loadVideos(1)"
                                class="px-5 py-2 rounded-md text-xs font-semibold transition-all"
                                :class="filterMediaType === 'IMAGE' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'">
                                <i class="fa-solid fa-image text-[10px] mr-1"></i>Ảnh
                            </button>
                        </div>

                        <!-- Số phần tử mỗi trang -->
                        <div class="flex items-center gap-2">
                            <label class="text-xs font-semibold text-slate-500 whitespace-nowrap">Hiển thị:</label>
                            <select x-model.number="pagination.limit" @change="loadVideos(1)"
                                class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 pl-2 pr-6 py-1.5 font-medium outline-none cursor-pointer">
                                <option value="10">10</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                            <span class="text-xs text-slate-400">/ trang</span>
                        </div>
                    </div>

                    <!-- Multi-Select Batch Retry Toolbar -->
                    <div x-show="selectedTaskIds.length > 0" x-transition
                        class="mb-4 flex items-center gap-3 bg-indigo-50 border border-indigo-200 rounded-xl px-4 py-3">
                        <input type="checkbox" :checked="selectedTaskIds.length === videos.length && videos.length > 0"
                            @change="toggleSelectAll()"
                            class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
                        <span class="text-sm font-semibold text-indigo-700">
                            Đã chọn <span class="bg-indigo-600 text-white text-xs font-bold px-2 py-0.5 rounded-full"

                        <button @click="retrySelectedTasks()" :disabled="batchRetrying"

                    </div>

                    <!-- Grid Videos per Project -->
                    <div class="relative">
                        <!-- Loading Overlay (shows on top of existing videos during filter/page change) -->

                            <div class="loading-spinner-container">
                                <div class="loading-dots">
                                    <span></span><span></span><span></span>
                                </div>
                                <span class="text-xs font-semibold text-slate-500">Đang tải dữ liệu...</span>
                            </div>
                        </div>

                        <!-- Skeleton Loading Cards (shows when loading with no existing data) -->
                        <template x-if="videoLoading && videos.length === 0 && selectedProjectId">
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start">
                                <template x-for="i in 6" :key="'skel-'+i">
                                    <div class="skeleton-card p-0 flex flex-col" style="min-height: 280px;">
                                        <!-- Skeleton Header -->
                                        <div class="p-3 border-b border-slate-200/50 flex justify-between items-center">
                                            <div class="flex flex-col gap-1.5 w-2/3">
                                                <div class="skeleton-line h-3 w-4/5"></div>
                                                <div class="skeleton-line h-2 w-1/2"></div>
                                            </div>
                                            <div class="skeleton-line h-5 w-16 rounded-full"></div>
                                        </div>
                                        <!-- Skeleton Body -->
                                        <div class="p-4 flex-1 flex flex-col gap-3">
                                            <div class="flex gap-1.5">
                                                <div class="skeleton-line h-4 w-12"></div>
                                                <div class="skeleton-line h-4 w-16"></div>
                                                <div class="skeleton-line h-4 w-14"></div>
                                            </div>
                                            <div class="skeleton-line h-2.5 w-full"></div>
                                            <div class="skeleton-line h-2.5 w-11/12"></div>
                                            <div class="skeleton-line h-2.5 w-3/4"></div>
                                        </div>
                                        <!-- Skeleton Footer -->
                                        <div class="p-3 border-t border-slate-200/50">
                                            <div class="skeleton-line h-8 w-full rounded-md"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start"
                            :class="{ 'opacity-40 pointer-events-none select-none': videoLoading && videos.length > 0 }"
                            style="transition: opacity 0.3s ease;">
                            <!-- Missing Videos Placeholder -->
                            <template x-if="videos.length === 0 && !videoLoading">
                                <div
                                    class="col-span-full py-12 text-center text-slate-500 text-sm bg-white rounded-xl border border-slate-200 border-dashed">
                                    Chưa có VideoTask nào thuộc dự án này được sinh ra hoặc được
                                    tìm thấy
                                </div>
                            </template>

                            <!-- Video Iteration -->
                            <template x-for="(vid, index) in videos"
                                :key="(vid.id || vid.task_id) ? (vid.id || vid.task_id) + '_' + index : 'vid_' + index">
                                <div class="bg-white rounded-xl border border-slate-200 flex flex-col shadow-sm group relative transition-shadow duration-150 hover:shadow-md"

                                    style="outline: 2px solid transparent; outline-offset: -2px; transition: outline-color 0.15s, box-shadow 0.15s; min-height: 220px;"
                                    :style="selectedTaskIds.includes(vid.id || vid.task_id) ? 'outline-color: #6366f1' : ''"
                                    onmouseenter="if(!this.style.outlineColor || this.style.outlineColor === 'transparent') this.style.outlineColor='#a5b4fc'"
                                    onmouseleave="if(!this.querySelector('[data-selected=true]')) this.style.outlineColor='transparent'"
                                    @click.stop="toggleTaskSelect(vid.id || vid.task_id)"
                                    @click.outside="showActions = false">

                                    <!-- Quick Actions Overlay (chỉ hiện khi bấm nút action, không phải click card) -->
                                    <div x-show="showActions" x-cloak
                                        x-transition:enter="transition ease-out duration-150"
                                        x-transition:enter-start="opacity-0 scale-95"
                                        x-transition:enter-end="opacity-100 scale-100"
                                        x-transition:leave="transition ease-in duration-100"
                                        x-transition:leave-start="opacity-100 scale-100"
                                        x-transition:leave-end="opacity-0 scale-95"
                                        class="absolute inset-0 z-40 bg-black/50 backdrop-blur-[2px] rounded-xl flex items-center justify-center gap-3 p-4"
                                        @click.stop>

                                        <!-- Retry Button -->
                                        <button @click.stop="showActions = false; openRetryModal(vid)"
                                            class="flex flex-col items-center gap-1.5 px-5 py-3 bg-white hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl shadow-lg transition-all duration-150 hover:scale-105 cursor-pointer">
                                            <i class="fa-solid fa-rotate-right text-indigo-500 text-lg"></i>
                                            <span class="text-xs font-bold text-slate-700">Retry</span>
                                        </button>

                                        <!-- Download Button -->
                                        <template x-if="vid.status === 'COMPLETED' && vid.media_id">
                                            <a :href="(vid.action_type === 'CREATE_IMAGE' || vid.action_type === 'create_image')
                                                    ? `/api/veo/image/${vid.id || vid.task_id}?idx=0&token=${localStorage.getItem('vietauto_apikey')}`
                                                    : `/api/veo/download/${vid.id || vid.task_id}?token=${localStorage.getItem('vietauto_apikey')}`"
                                                target="_blank" download @click.stop="showActions = false"
                                                class="flex flex-col items-center gap-1.5 px-5 py-3 bg-white hover:bg-emerald-50 border border-slate-200 hover:border-emerald-300 rounded-xl shadow-lg transition-all duration-150 hover:scale-105 cursor-pointer no-underline">
                                                <i class="fa-solid fa-download text-emerald-500 text-lg"></i>
                                                <span class="text-xs font-bold text-black">Tải xuống</span>
                                            </a>
                                        </template>

                                        <!-- Close -->
                                        <button @click.stop="showActions = false"
                                            class="absolute top-2 right-2 w-6 h-6 flex items-center justify-center rounded-full bg-white/80 hover:bg-white text-slate-500 hover:text-slate-800 transition-colors text-xs shadow">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                    <!-- Video Header -->
                                    <div
                                        class="p-3 border-b border-slate-100 bg-slate-50/50 relative flex justify-between items-center group-hover:bg-indigo-50/30 transition-colors rounded-t-xl">
                                        <div class="truncate flex-1 flex items-center gap-2">
                                            <!-- Checkbox multi-select -->
                                            <input type="checkbox" :value="vid.id || vid.task_id"
                                                :checked="selectedTaskIds.includes(vid.id || vid.task_id)"
                                                @click.stop="toggleTaskSelect(vid.id || vid.task_id)"
                                                class="w-4 h-4 shrink-0 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer" />
                                            <div class="truncate flex flex-col gap-0.5">
                                                <h4 class="font-bold text-xs text-slate-800 truncate" title="Tên Video"
                                                    x-text="vid.name">
                                                </h4>
                                                <span class="text-[9px] text-slate-500 font-medium"
                                                    x-show="vid.created_at"
                                                    x-text="'✓ ' + new Date(vid.created_at * 1000).toLocaleString('vi-VN')"
                                                    title="Thời gian tạo"></span>
                                                <span class="text-[9px] font-semibold" x-show="vid.completed_at"
                                                    :class="vid.status === 'COMPLETED' ? 'text-emerald-600' : 'text-red-500'"
                                                    x-text="(vid.status === 'COMPLETED' ? '⏱ ' : '✗ ') + new Date(vid.completed_at * 1000).toLocaleString('vi-VN')"
                                                    :title="vid.status === 'COMPLETED' ? 'Thời gian hoàn thành' : 'Thời gian trả lỗi'"></span>
                                            </div><!-- close inner name/time div -->
                                        </div>
                                        <div class="flex items-center gap-1.5">
                                            <span
                                                class="px-2 py-0.5 text-[9px] font-bold rounded shadow-sm uppercase tracking-wide"
                                                :class="{
                                                                    'bg-emerald-100 text-emerald-700 border border-emerald-200': vid.status === 'COMPLETED',
                                                                    'bg-indigo-100 text-indigo-700 border border-indigo-200 animate-pulse': vid.status === 'PROCESSING',
                                                                    'bg-amber-100 text-amber-700 border border-amber-200': vid.status === 'PENDING',
                                                                    'bg-red-100 text-red-700 border border-red-200': vid.status === 'FAILED' || vid.status === 'ERROR',
                                                                    'bg-slate-200 text-slate-600 border border-slate-300': vid.status === 'PAUSED'
                                                                }" x-text="vid.status"></span>
                                            <!-- Nút mở Quick Actions overlay -->
                                            <button @click.stop="showActions = !showActions" title="Hành động nhanh"
                                                class="text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 w-6 h-6 rounded flex items-center justify-center transition-colors">
                                                <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
                                            </button>
                                            <button @click.stop="deleteVideo(vid.id || vid.task_id)" x-show="isAdmin"
                                                title="Xóa Video"
                                                class="text-slate-400 hover:text-red-500 hover:bg-red-50 w-6 h-6 rounded flex items-center justify-center transition-colors">
                                                <i class="fa-solid fa-trash-can text-xs"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Video Content -->
                                    <div class="p-4 flex-1">
                                        <div class="flex flex-wrap gap-1.5 mb-3">
                                            <!-- Phân loại (T2V/I2V/IMG) -->
                                            <span class="px-2 py-0.5 text-[9px] font-bold rounded border"
                                                title="Loại tác vụ" :class="{
                                                                'bg-indigo-50 text-indigo-700 border-indigo-100': vid.action_type === 'TEXT_TO_VIDEO' || vid.action_type === 'text_to_video',
                                                                'bg-amber-50 text-amber-700 border-amber-100': vid.action_type === 'IMAGE_TO_VIDEO' || vid.action_type === 'image_to_video' || vid.action_type === 'FRAMES_TO_VIDEO' || vid.action_type === 'frames_to_video',
                                                                'bg-purple-50 text-purple-700 border-purple-100': vid.action_type === 'CREATE_IMAGE' || vid.action_type === 'create_image',
                                                                'bg-slate-100 text-slate-500 border-slate-200': !vid.action_type
                                                            }" x-text="
                                                                (vid.action_type === 'TEXT_TO_VIDEO' || vid.action_type === 'text_to_video') ? '🎬 T2V' :
                                                                (vid.action_type === 'IMAGE_TO_VIDEO' || vid.action_type === 'image_to_video') ? '🖼 I2V' :
                                                                (vid.action_type === 'FRAMES_TO_VIDEO' || vid.action_type === 'frames_to_video') ? '🎞 I2V±' :
                                                                (vid.action_type === 'CREATE_IMAGE' || vid.action_type === 'create_image') ? '📷 IMG' :
                                                                '—'
                                                            "></span>
                                            <!-- Model AI -->
                                            <span
                                                class="px-2 py-0.5 text-[9px] font-bold rounded bg-indigo-50 text-indigo-700 border border-indigo-100"
                                                title="Mô hình AI" x-text="vid.model || 'VEO_3.1'"></span>
                                            <!-- Ratio -->
                                            <span
                                                class="px-2 py-0.5 text-[9px] font-bold rounded bg-blue-50 text-blue-700 border border-blue-100"
                                                title="Tỷ lệ màn hình" x-text="(() => {
                                                const r = (vid.screen_ratio || '').toUpperCase();
                                                if (r.includes('PORTRAIT') || r === '9:16') return '📱 9:16';
                                                if (r.includes('SQUARE') || r === '1:1') return '⬜ 1:1';
                                                return '🖥 16:9';
                                            })()"></span>
                                            <!-- Nguon AI: GROK vs IMAGEN (Có fallback cho task cũ) -->
                                            <template
                                                x-if="vid.source === 'grok' || (!vid.source && vid.model !== 'NARWHAL' && (vid.action_type === 'CREATE_IMAGE' || vid.action_type === 'create_image'))">
                                                <span
                                                    class="px-2 py-0.5 text-[9px] font-bold rounded bg-pink-50 text-pink-700 border border-pink-200"
                                                    title="Tạo bởi Grok AI">🔮 Veo3</span>
                                            </template>
                                            <template
                                                x-if="vid.source === 'imagen' || (!vid.source && vid.model === 'NARWHAL' && (vid.action_type === 'CREATE_IMAGE' || vid.action_type === 'create_image'))">
                                                <span
                                                    class="px-2 py-0.5 text-[9px] font-bold rounded bg-violet-50 text-violet-700 border border-violet-200"
                                                    title="Tạo bởi Google Imagen">✨ Veo3</span>
                                            </template>
                                        </div>
                                        <div class="relative" x-data="{ showDetail: false }"
                                            @mouseleave="showDetail = false">
                                            <div
                                                class="text-[10px] text-slate-400 mb-1 font-bold uppercase tracking-wider border-b border-slate-100 pb-1 flex items-center justify-between">
                                                <span>Prompt:</span>
                                                <button @click.stop="showDetail = !showDetail"
                                                    @mouseenter="showDetail = true"
                                                    class="text-[9px] text-indigo-400 hover:text-indigo-600 font-semibold flex items-center gap-0.5 cursor-pointer transition-colors">
                                                    <i class="fa-solid fa-eye text-[8px]"></i> Chi tiết
                                                </button>
                                            </div>
                                            <p class="text-xs text-slate-600 line-clamp-3 leading-relaxed cursor-pointer"
                                                @mouseenter="showDetail = true"
                                                x-text="(vid.prompts && vid.prompts.length > 0) ? vid.prompts[0] : (vid.prompt || 'N/A')">
                                            </p>

                                            <!-- Hover Detail Popover -->
                                            <div x-show="showDetail"
                                                x-transition:enter="transition ease-out duration-200"
                                                x-transition:enter-start="opacity-0 translate-y-2 scale-95"
                                                x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                                                x-transition:leave="transition ease-in duration-150"
                                                x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                                                x-transition:leave-end="opacity-0 translate-y-2 scale-95"
                                                @click.away="showDetail = false"
                                                class="absolute z-50 left-0 right-0 top-full mt-1 bg-white rounded-xl border border-indigo-200 shadow-2xl shadow-indigo-500/10 p-4 max-h-[400px] overflow-y-auto"
                                                style="min-width: 280px;">
                                                <!-- Full Prompt -->
                                                <div class="mb-3" x-data="{ copied: false }">
                                                    <div
                                                        class="text-[10px] text-indigo-500 font-bold uppercase tracking-wider mb-1.5 flex items-center gap-1 justify-between">
                                                        <span class="flex items-center gap-1">
                                                            <i class="fa-solid fa-quote-left text-[8px]"></i> Full
                                                            Prompt
                                                        </span>
                                                        <button @click.stop="
                                                        const txt = (vid.prompts && vid.prompts.length > 0) ? vid.prompts[0] : (vid.prompt || '');
                                                        navigator.clipboard.writeText(txt).then(() => { copied = true; setTimeout(() => copied = false, 2000); });
                                                    " class="flex items-center gap-1 px-2 py-0.5 rounded-md transition-all text-[9px] font-bold"
                                                            :class="copied ? 'bg-emerald-100 text-emerald-600 border border-emerald-200' : 'bg-slate-100 text-slate-500 hover:bg-indigo-100 hover:text-indigo-600 border border-slate-200'">
                                                            <i class="text-[8px]"
                                                                :class="copied ? 'fa-solid fa-check' : 'fa-regular fa-copy'"></i>
                                                            <span x-text="copied ? 'Đã copy!' : 'Copy'"></span>
                                                        </button>
                                                    </div>
                                                    <p class="text-[11px] text-slate-700 leading-relaxed whitespace-pre-wrap break-words bg-slate-50 rounded-lg p-3 border border-slate-100 select-all"
                                                        x-text="(vid.prompts && vid.prompts.length > 0) ? vid.prompts[0] : (vid.prompt || 'N/A')">
                                                    </p>
                                                </div>

                                                <!-- Reference Images (image_refs) -->
                                                <template x-if="vid.image_refs && vid.image_refs.length > 0">
                                                    <div class="mt-3 pt-3 border-t border-slate-100">
                                                        <div
                                                            class="text-[10px] text-violet-500 font-bold uppercase tracking-wider mb-2 flex items-center gap-1">
                                                            <i class="fa-solid fa-images text-[8px]"></i> Ảnh tham chiếu
                                                            <span
                                                                class="bg-violet-100 text-violet-600 px-1.5 py-0.5 rounded-full text-[8px]"
                                                                x-text="vid.image_refs.length"></span>
                                                        </div>
                                                        <div class="grid gap-2"
                                                            :class="vid.image_refs.length > 1 ? 'grid-cols-2' : 'grid-cols-1'">
                                                            <template x-for="(ref, refIdx) in vid.image_refs"
                                                                :key="refIdx">
                                                                <a :href="`/api/veo/ref-image/${vid.id || vid.task_id}?idx=${refIdx}&token=${localStorage.getItem('vietauto_apikey')}`"
                                                                    target="_blank" class="block">
                                                                    <img :src="`/api/veo/ref-image/${vid.id || vid.task_id}?idx=${refIdx}&token=${localStorage.getItem('vietauto_apikey')}`"
                                                                        class="w-full h-24 object-cover rounded-lg border border-slate-200 hover:border-violet-400 hover:shadow-md transition-all cursor-zoom-in"
                                                                        :alt="'Ảnh tham chiếu ' + (refIdx+1)"
                                                                        onerror="this.parentElement.style.display='none'">
                                                                </a>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>

                                                <!-- I2V Reference Images (from raw_result.images_b64) -->
                                                <template
                                                    x-if="(!vid.image_refs || vid.image_refs.length === 0) && vid.raw_result && vid.raw_result.images_b64 && vid.raw_result.images_b64.length > 0">

                                                        <div
                                                            class="text-[10px] text-amber-500 font-bold uppercase tracking-wider mb-2 flex items-center gap-1">
                                                            <i class="fa-solid fa-image text-[8px]"></i> Ảnh gốc I2V
                                                            <span
                                                                class="bg-amber-100 text-amber-600 px-1.5 py-0.5 rounded-full text-[8px]"
                                                                x-text="vid.raw_result.images_b64.length"></span>
                                                        </div>
                                                        <div class="grid gap-2"
                                                            :class="vid.raw_result.images_b64.length > 1 ? 'grid-cols-2' : 'grid-cols-1'">
                                                            <template x-for="(img, imgIdx) in vid.raw_result.images_b64"
                                                                :key="imgIdx">
                                                                <a :href="`/api/veo/ref-image/${vid.id || vid.task_id}?idx=${imgIdx}&token=${localStorage.getItem('vietauto_apikey')}`"
                                                                    target="_blank" class="block">
                                                                    <img :src="`/api/veo/ref-image/${vid.id || vid.task_id}?idx=${imgIdx}&token=${localStorage.getItem('vietauto_apikey')}`"
                                                                        class="w-full h-24 object-cover rounded-lg border border-slate-200 hover:border-amber-400 hover:shadow-md transition-all cursor-zoom-in"
                                                                        :alt="img.name || ('Ảnh I2V ' + (imgIdx+1))"
                                                                        onerror="this.parentElement.style.display='none'">
                                                                </a>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Video Actions -->
                                    <div class="p-3 bg-slate-50 border-t border-slate-200 flex gap-2">
                                        <!-- COMPLETED + Image (CREATE_IMAGE) -->
                                        <template
                                            x-if="vid.status === 'COMPLETED' && vid.media_id && (vid.action_type === 'CREATE_IMAGE' || vid.action_type === 'create_image')">
                                            <div class="flex-1 flex flex-col gap-2 w-full">
                                                <!-- Nhiều ảnh: lấy từ raw_result.image_paths nếu có -->
                                                <template
                                                    x-if="vid.raw_result && vid.raw_result.image_paths && vid.raw_result.image_paths.length > 1">
                                                    <div class="flex flex-col gap-1">
                                                        <template x-for="(p, idxImg) in vid.raw_result.image_paths"
                                                            :key="idxImg">
                                                            <div>
                                                                <a :href="`/api/veo/image/${vid.id || vid.task_id}?idx=${idxImg}&token=${localStorage.getItem('vietauto_apikey')}`"
                                                                    target="_blank" class="block">
                                                                    <img :src="`/api/veo/image/${vid.id || vid.task_id}?idx=${idxImg}&token=${localStorage.getItem('vietauto_apikey')}`"
                                                                        :alt="'Ảnh ' + (idxImg+1)"
                                                                        class="w-full h-48 object-cover rounded border border-slate-200 hover:opacity-90 transition-opacity cursor-zoom-in"
                                                                        onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22192%22 viewBox=%220 0 100 60%22><rect fill=%22%23f1f5f9%22 width=%22100%25%22 height=%22100%25%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22 font-size=%226%22>Không tải được ảnh</text></svg>'">
                                                                </a>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                                <!-- Một ảnh: dùng idx=0 -->
                                                <template
                                                    x-if="!(vid.raw_result && vid.raw_result.image_paths && vid.raw_result.image_paths.length > 1)">
                                                    <a :href="`/api/veo/image/${vid.id || vid.task_id}?idx=0&token=${localStorage.getItem('vietauto_apikey')}`"
                                                        target="_blank" class="block">
                                                        <img :src="`/api/veo/image/${vid.id || vid.task_id}?idx=0&token=${localStorage.getItem('vietauto_apikey')}`"
                                                            alt="Generated image"
                                                            class="w-full h-48 object-cover rounded border border-slate-200 hover:opacity-90 transition-opacity cursor-zoom-in"
                                                            onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22192%22 viewBox=%220 0 100 60%22><rect fill=%22%23f1f5f9%22 width=%22100%25%22 height=%22100%25%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22 font-size=%226%22>Không tải được ảnh</text></svg>'">
                                                    </a>
                                                </template>
                                                <a :href="`/api/veo/image/${vid.id || vid.task_id}?idx=0&token=${localStorage.getItem('vietauto_apikey')}`"
                                                    target="_blank" download
                                                    class="w-full text-white text-center py-2 rounded text-xs font-bold transition-colors block shadow"
                                                    style="background:#2563eb">
                                                    <i class="fa-solid fa-image mr-1"></i> Xem /
                                                    Lưu Ảnh
                                                </a>
                                            </div>
                                        </template>

                                        <!-- COMPLETED + Video (T2V / I2V) + file còn tồn tại -->
                                        <template
                                            x-if="vid.status === 'COMPLETED' && vid.media_id && vid.file_exists !== false && vid.action_type !== 'CREATE_IMAGE' && vid.action_type !== 'create_image'">
                                            <div class="flex-1 flex flex-col gap-2 w-full">
                                                <video
                                                    :src="`/api/veo/download/${vid.id || vid.task_id}?token=${localStorage.getItem('vietauto_apikey')}`"
                                                    controls controlsList="nodownload" preload="metadata" autoplay muted
                                                    loop playsinline
                                                    class="w-full h-36 object-contain rounded bg-black border border-slate-200"></video>
                                                <!-- Filename Display -->
                                                <div x-show="vid.output_filename"
                                                    class="flex items-center gap-1.5 px-2 py-1 bg-slate-100 rounded border border-slate-200 text-[10px] font-mono text-slate-600 overflow-hidden">
                                                    <i class="fa-solid fa-file-video text-indigo-400 flex-shrink-0"></i>
                                                    <span class="truncate" x-text="vid.output_filename"
                                                        :title="vid.output_filename"></span>
                                                </div>
                                                <a :href="`/api/veo/download/${vid.id || vid.task_id}?token=${localStorage.getItem('vietauto_apikey')}`"
                                                    target="_blank" x-show="hasPermission('SHARE_VIDEO')"
                                                    class="w-full bg-primary hover:bg-blue-600 text-slate-900 shadow text-center py-2 rounded text-xs font-bold transition-colors block">
                                                    <i class="fa-solid fa-download mr-1"></i>
                                                    Lưu Video
                                                </a>
                                            </div>
                                        </template>
                                        <!-- COMPLETED + file đã bị xóa khỏi máy (chỉ video) -->
                                        <template
                                            x-if="vid.status === 'COMPLETED' && vid.media_id && vid.file_exists === false && vid.action_type !== 'CREATE_IMAGE' && vid.action_type !== 'create_image'">
                                            <div class="flex-1 flex flex-col gap-2 w-full">
                                                <div
                                                    class="flex-1 text-center py-4 px-3 text-[11px] text-orange-700 bg-orange-50 rounded border border-orange-200">
                                                    <i
                                                        class="fa-solid fa-triangle-exclamation text-xl text-orange-400 mb-2 block mx-auto"></i>
                                                    <p class="font-bold mb-1">File đã bị xóa
                                                        khỏi máy</p>
                                                    <p class="text-[10px] font-mono text-orange-500 truncate"
                                                        x-text="vid.output_filename || ''"></p>
                                                </div>
                                                <button @click="deleteVideo(vid.id || vid.task_id)"
                                                    class="w-full bg-slate-200 hover:bg-slate-300 text-slate-600 text-center py-1.5 rounded text-xs font-bold transition-colors">
                                                    <i class="fa-solid fa-trash-can mr-1"></i>
                                                    Xóa khỏi danh sách
                                                </button>
                                            </div>
                                        </template>
                                        <template x-if="vid.status === 'PROCESSING' || vid.status === 'PENDING'">
                                            <div class="flex-1 flex flex-col gap-2 w-full">
                                                <div
                                                    class="flex-1 text-center py-4 text-xs text-slate-500 font-medium bg-blue-50/50 rounded border border-slate-200 border-dashed">
                                                    <i
                                                        class="fa-solid fa-gear fa-spin text-xl text-primary mb-2 block mx-auto"></i>
                                                    Đang xử lý AI...
                                                </div>
                                                <!-- Nút Force Retry cho task PENDING bị treo -->
                                                <button @click.stop="openRetryModal(vid)" x-show="isAdmin"
                                                    class="w-full bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 shadow-sm text-center py-1.5 rounded text-xs font-bold transition-colors block"
                                                    title="Ép re-queue task này nếu bị treo">
                                                    <i class="fa-solid fa-rotate-right mr-1"></i>
                                                    Force Retry
                                                </button>
                                            </div>
                                        </template>
                                        <template x-if="vid.status === 'FAILED' || vid.status === 'ERROR'">
                                            <div class="flex-1 flex flex-col gap-2 w-full">
                                                <div class="flex flex-col items-center gap-2 py-2 px-1 text-[11px] text-red-600 bg-red-500/5 rounded border border-red-500/20">
                                                    <div class="w-full text-center break-words" x-text="vid.error || 'Lỗi kết xuất.'"></div>
                                                    <div class="text-[10px] font-black tracking-[0.2em] uppercase text-red-700 bg-red-100 border border-red-200 px-2 py-0.5 rounded-full">FAILED</div>
                                                </div>
                                                <button @click="openRetryModal(vid)"
                                                    class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 shadow-sm text-center py-1.5 rounded text-xs font-bold transition-colors block">
                                                    <i class="fa-solid fa-rotate-right mr-1"></i>
                                                    Thử lại
                                                </button>
                                            </div>
                                        </template>
                                        <template x-if="vid.status === 'PAUSED'">
                                            <div class="flex-1 flex flex-col gap-2 w-full">
                                                <div
                                                    class="flex-1 text-center py-4 text-xs text-slate-500 font-medium bg-slate-50 rounded border border-slate-200 border-dashed">
                                                    <i
                                                        class="fa-solid fa-pause text-xl text-slate-400 mb-2 block mx-auto"></i>
                                                    Đã tạm dừng
                                                </div>
                                                <button @click="openRetryModal(vid)" x-show="isAdmin"
                                                    class="w-full bg-indigo-100 hover:bg-indigo-200 text-indigo-700 border border-indigo-300 shadow-sm text-center py-1.5 rounded text-xs font-bold transition-colors block"
                                                    title="Tiếp tục xử lý task này">
                                                    <i class="fa-solid fa-play mr-1"></i>
                                                    Resume
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div> <!-- close relative wrapper -->

                    <!-- Modern Pagination Controls -->
                    <div class="mt-10 flex flex-col sm:flex-row justify-between items-center gap-5 bg-white p-3 sm:p-4 rounded-xl border border-slate-200 shadow-sm"
                        x-show="totalPages > 1" x-transition>
                        <div class="text-[13px] font-medium text-slate-500 flex items-center gap-2">
                            <div x-show="videoLoading">
                                <i class="fa-solid fa-circle-notch fa-spin text-indigo-500"></i>
                            </div>
                            <span>
                                Hiển thị trang <span class="font-bold text-slate-900" x-text="pagination.page"></span>
                                trên <span class="font-bold text-slate-900" x-text="totalPages"></span>
                            </span>
                        </div>

                        <div
                            class="flex items-center gap-1 bg-slate-50/80 p-1 rounded-lg border border-slate-200/60 shadow-inner">
                            <button type="button" @click="loadVideos(pagination.page - 1)"
                                :disabled="pagination.page <= 1 || videoLoading"
                                class="px-3 sm:px-4 py-1.5 text-[12px] sm:text-[13px] font-semibold rounded-md transition-all flex items-center gap-1.5 disabled:opacity-40"
                                :class="pagination.page <= 1 ? 'text-slate-400 cursor-not-allowed' : 'text-slate-700 hover:bg-white hover:text-indigo-600 hover:shadow-sm'">
                                <i class="fa-solid fa-chevron-left text-[10px]"></i> Trước
                            </button>

                            <div class="flex items-center px-1 space-x-0.5 hidden sm:flex">
                                <template x-for="(p, idx) in paginationPages" :key="idx">
                                    <div class="inline-block">
                                        <template x-if="p === '...'">
                                            <span
                                                class="min-w-[32px] text-center text-slate-400 text-xs font-bold leading-8 tracking-widest pl-1">...</span>
                                        </template>
                                        <template x-if="p !== '...'">
                                            <button type="button" @click="loadVideos(p)" :disabled="videoLoading"
                                                class="min-w-[32px] h-8 flex items-center justify-center text-[13px] font-bold rounded-md transition-all px-1"
                                                :class="parseInt(pagination.page) === p ? 'bg-indigo-600 text-white shadow-md shadow-indigo-500/30' : 'text-slate-600 hover:bg-white hover:text-indigo-600 hover:shadow-sm'"
                                                x-text="p">
                                            </button>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <button type="button" @click="loadVideos(pagination.page + 1)"
                                :disabled="pagination.page >= totalPages || videoLoading"
                                class="px-3 sm:px-4 py-1.5 text-[12px] sm:text-[13px] font-semibold rounded-md transition-all flex items-center gap-1.5 disabled:opacity-40"
                                :class="pagination.page >= totalPages ? 'text-slate-400 cursor-not-allowed' : 'text-slate-700 hover:bg-white hover:text-indigo-600 hover:shadow-sm'">
                                Tiếp <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
