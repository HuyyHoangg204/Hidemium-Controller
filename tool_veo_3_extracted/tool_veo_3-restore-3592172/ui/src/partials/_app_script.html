                        this.jobResultsTotal = data.total || 0;
                        this.jobResultsSkip = data.skip || 0;
                        this.jobResultsLimit = data.limit || this.jobResultsLimit;
                        this.$nextTick(() => this.renderJobResultsGrid());
                    } catch (err) {
                        this.showToast('Lỗi tải danh sách job: ' + err.message, 'error');
                    } finally {
                        this.loadingJobResults = false;
                    }
                },

                renderJobResultsGrid() {
                    const mount = document.getElementById('job-results-grid');
                    if (!mount || typeof gridjs === 'undefined') return;

                    const rows = (this.jobResults || []).map((item) => {
                        const promptText = item.prompt || '—';
                        const promptPreview = this.truncateText(promptText, 180);
                        const promptHtml = `
                            <div class="job-result-prompt-cell text-left" title="${this.escapeHtml(promptText)}">
                                <div class="max-h-[4.75rem] overflow-hidden whitespace-pre-wrap break-words text-left leading-5 cursor-help">${this.escapeHtml(promptPreview)}</div>
                            </div>
                            ${item.error ? `<div class="mt-3 rounded-lg bg-rose-50 px-3 py-2 text-left text-[12px] text-rose-700 leading-6 break-words" title="${this.escapeHtml(item.error)}">${this.escapeHtml(this.truncateText(item.error, 220))}</div>` : ''}`;
                        return [
                        this.jobResultDisplayName(item),
                        item.created_time || this.formatTimestamp(item.created_at),
                        gridjs.html(promptHtml),
                        gridjs.html(`<span class="inline-flex items-center justify-start rounded-full px-4 py-2 text-left text-[11px] font-black tracking-wide leading-5 ${item.status === 'completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${this.escapeHtml(item.status || '—')}</span>`),
                        this.formatDuration(item.duration_seconds),
                        item.download_url
                            ? gridjs.html(`<a href="${this.escapeHtml(item.download_url)}" target="_blank" class="inline-flex items-center justify-start gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-left text-xs font-black text-white hover:bg-indigo-700 shadow-sm"><i class="fa-solid fa-arrow-up-right-from-square"></i>Mở</a>`)
                            : '—',
                        ];
                    });

                    const config = {
                        columns: [
                            { name: 'Name', width: '170px' },
                            { name: 'Created Time', width: '190px' },
                            { name: 'Prompt', width: '520px' },
                            { name: 'Status', width: '160px' },
                            { name: 'Duration', width: '150px' },
                            { name: 'Link', width: '120px' },
                        ],
                        data: rows,
                        sort: false,
                        search: false,
                        pagination: false,
                        autoWidth: false,
                        className: {
                            table: 'text-left text-black',
                            th: 'text-left',
                            td: 'text-left',
                        },
                        language: {
                            noRecordsFound: 'Chưa có dữ liệu hoặc filter không có kết quả.',
                            loading: 'Đang tải danh sách...',
                        },
                    };

                    if (this.jobResultsGrid) {
                        this.jobResultsGrid.updateConfig(config).forceRender();
                    } else {
                        mount.innerHTML = '';
                        this.jobResultsGrid = new gridjs.Grid(config).render(mount);
                    }
                },

                jobResultDisplayName(item) {
                    const username = String(item?.username || '').trim();
                    if (username && username !== '—') return username;

                    const userName = String(item?.user_name || item?.owner_username || '').trim();
                    if (userName && userName !== '—') return userName;

                    return this.currentUser?.username || '—';
                },

                escapeHtml(value) {
                    return String(value ?? '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
                },

                truncateText(value, limit = 260) {
                    const text = String(value ?? '');
                    if (text.length <= limit) return text;
                    return `${text.slice(0, Math.max(0, limit - 3)).trimEnd()}...`;
                },

                formatDuration(seconds) {
                    const value = Number(seconds || 0);
                    if (!value) return '—';
                    return `${value.toFixed(2)}s`;
                },

                formatTimestamp(value) {
                    const ts = Number(value || 0);
                    if (!ts) return '—';
                    const date = new Date(ts * 1000);
                    if (Number.isNaN(date.getTime())) return '—';
                    const pad = (n) => String(n).padStart(2, '0');
                    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
                },

                async loadQueueSettings() {

                            max_concurrent: this.queueStats.max_concurrent,

                        await this.loadQueueSettings();
                    } catch (err) {

                async createNewProject() {

                async deleteProject(projectId) {

                    if (!confirm("Bạn có chắc chắn muốn xoá toàn bộ dự án này không? (Bao gồm tất cả video trong dự án)")) return;

                async handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const text = await file.text();
                    this.batchForm.promptsText = text;
                    event.target.value = ''; // reset file input
                    this.showToast('Import file prompts thành công!', 'success');
                },

                async handleVideoExcelImport(event) {
                    const file = event.target.files[0];
                    event.target.value = '';
                    if (!file) return;

                    if (typeof XLSX === 'undefined') {
                        this.showToast('Thư viện SheetJS chưa tải xong, thử lại sau!', 'error');
                        return;
                    }

                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        const sheet = workbook.Sheets[sheetName];
                        // Đọc raw data (không dùng header) để lấy chính xác cột thứ 2
                        const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

                        if (!rawRows || rawRows.length === 0) {
                            this.showToast('File Excel không có dữ liệu!', 'error');
                            return;
                        }

                        // Bỏ dòng header (dòng đầu tiên), lấy cột thứ 2 (index 1) làm prompt
                        const prompts = [];
                        for (let i = 1; i < rawRows.length; i++) {
                            const row = rawRows[i];
                            const prompt = (row[1] || '').toString().replace(/[\r\n]+/g, ' ').trim();  // Cột thứ 2 (index 1), gộp newline trong cell
                            if (prompt) {
                                prompts.push(prompt);
                            }
                        }

                        if (prompts.length === 0) {
                            this.showToast('Không tìm thấy prompt nào ở cột thứ 2!', 'error');
                            return;
                        }

                        // Ghi vào textarea (mỗi prompt 1 dòng)
                        this.batchForm.promptsText = prompts.join('\n');
                        this.showToast(`Đã đọc ${prompts.length} prompts từ "${file.name}" (cột 2)`, 'success');
                    } catch (err) {
                        this.showToast('Không đọc được file Excel: ' + err.message, 'error');
                    }
                },

                async createVideo() {
                    const prompts = this.batchForm.promptsText.split('\n').map(p => p.trim()).filter(p => p);

                    const isNewProject = this.batchForm.project_id === 'NEW';
                    if (isNewProject && !this.batchForm.name) {
                        this.showToast('Vui lòng nhập tên dự án mới', 'error');
                        return;
                    }
                    if (prompts.length === 0) {
                        this.showToast('Vui lòng nhập ít nhất 1 prompt', 'error');
                        return;
                    }

                    // ⚠ Pre-flight: kiểm tra cookie pool nếu không dùng cookie riêng
                    const hasCustomCookie = this.batchForm.veo_cookie && this.batchForm.veo_cookie.trim();
                    if (!hasCustomCookie && this.isAdmin && Object.keys(this.cookieHealthMap).length > 0) {
                        const activeAccIds = this.veoAccounts.filter(a => a.is_active).map(a => a.id);
                        const badCookies = activeAccIds.filter(id => ['expired', 'revoked'].includes(this.cookieHealthMap[id]?.status));
                        const goodCookies = activeAccIds.filter(id => this.cookieHealthMap[id]?.status === 'ok' || this.cookieHealthMap[id]?.status === 'warning');
                        if (activeAccIds.length > 0 && badCookies.length === activeAccIds.length) {
                            this.showToast('⚠ Tất cả cookie trong Pool đã chết (expired/revoked)! Vào Quản Lý Nhóm Chứng Chỉ để cập nhật cookie mới.', 'error');
                            return;
                        } else if (badCookies.length > 0 && goodCookies.length === 0) {
                            if (!confirm(`Cảnh báo: ${badCookies.length} cookie trong Pool không hoạt động. Bạn có muốn tiếp tục không?`)) return;
                        }
                    }

                    this.videoCreating = true;
                    this.videoStatus.show = true;
                    this.videoStatus.logs = [];

                    const logName = isNewProject ? this.batchForm.name : `Project ID: ${this.batchForm.project_id}`;
                    this.logTerminal(`> Khởi tạo Batch Project: ${logName} với ${prompts.length} videos...`);

                    try {
                        const payload = {
                            prompts: prompts,
                            model: this.batchForm.model,
                            screen_ratio: this.batchForm.screen_ratio,
                            videos_per_prompt: this.batchForm.videosPerPrompt,
                            max_threads: this.batchForm.maxThreads
                        };

                        if (this.batchForm.veo_cookie && this.batchForm.veo_cookie.trim() !== '') {
                            payload.veo_cookie = this.batchForm.veo_cookie.trim();
                        }
                        if (this.batchForm.proxy_url && this.batchForm.proxy_url.trim() !== '') {
                            payload.proxy_url = this.batchForm.proxy_url.trim();
                        }

                        if (isNewProject) {
                            payload.name = this.batchForm.name;
                        } else {
                            // Dummy name for the API if project_id exists,
                            // though the API uses name only when project_id is missing.
                            payload.name = "Existing Project Update";
                            payload.project_id = this.batchForm.project_id;

                        this.logTerminal(`Batch Task đã gửi lên Background Worker thành công! Project ID: ${data.id}`);
                        this.logTerminal(`Đang tự động chuyển sang Thư viện Video Queue...`);

                        this.showToast(`Bắt đầu xử lý ${prompts.length} video ngầm!`);

                        // Refresh and switch
                        await this.loadProjects();
                        setTimeout(() => {
                            this.videoStatus.show = false;
                            this.videos = [];
                            this.activeMenu = 'video_gallery';
                            this.selectedProjectId = data.id;

                    } catch (err) {

                async loadVideos(page = 1) {
                    if (!this.hasPermission('VIEW_VIDEO')) return;

                    this.pagination.page = page;
                    this.videoLoading = true;
                    // Start NProgress top bar
                    if (typeof NProgress !== 'undefined') {
                        NProgress.configure({ showSpinner: false, speed: 400, minimum: 0.15 });
                        NProgress.start();
                    }
                    try {
                        let url = `/veo/videos?page=${this.pagination.page}&limit=${this.pagination.limit}`;
                        if (this.selectedProjectId) url += `&project_id=${this.selectedProjectId}`;
                        if (this.searchQuery && this.searchQuery.trim() !== '') {
                            url += `&search=${encodeURIComponent(this.searchQuery.trim())}`;
                        }
                        if (this.filterStatus && this.filterStatus !== 'ALL') {
                            url += `&status=${this.filterStatus}`;
                        }
                        if (this.filterMediaType && this.filterMediaType !== 'ALL') {
                            url += `&media_type=${this.filterMediaType}`;
                        }
                        if (this.filterDate) {
                            url += `&date_from=${this.filterDate}`;
                        }

                        const res = await this.apiCall(url);
                        this.videos = res.items || [];
                        // Clear selections khi chuyển trang/filter
                        this.selectedTaskIds = [];

                        if (res.total !== undefined) {
                            this.pagination.total = res.total;
                            this.pagination.hasMore = res.has_more;
                        }
                    } catch (err) {
                        this.showToast(err.message || 'Không tải được danh sách Videos', 'error');
                        console.error("loadVideos error:", err);
                    } finally {
                        this.videoLoading = false;
                        if (typeof NProgress !== 'undefined') NProgress.done();
                    }
                },

                get totalPages() {
                    return Math.max(1, Math.ceil(this.pagination.total / this.pagination.limit));
                },

                get paginationPages() {
                    const current = parseInt(this.pagination.page);
                    const last = this.totalPages;
                    const delta = 1;

                    let left = current - delta;
                    let right = current + delta;
                    let range = [];
                    let rangeWithDots = [];
                    let l;

                    for (let i = 1; i <= last; i++) {
                        if (i === 1 || i === last || i >= left && i <= right) {
                            range.push(i);
                        }
                    }

                    for (let i of range) {
                        if (l) {
                            if (i - l === 2) {
                                rangeWithDots.push(l + 1);
                            } else if (i - l !== 1) {
                                rangeWithDots.push('...');
                            }
                        }
                        rangeWithDots.push(i);
                        l = i;
                    }

                    return rangeWithDots;
                },

                get jobResultsCurrentPage() {
                    return Math.floor(this.jobResultsSkip / this.jobResultsLimit) + 1;
                },

                get jobResultsTotalPages() {
                    return Math.max(1, Math.ceil(this.jobResultsTotal / this.jobResultsLimit));
                },

                get jobResultsPaginationPages() {
                    const current = parseInt(this.jobResultsCurrentPage);
                    const last = this.jobResultsTotalPages;
                    const delta = 1;
                    let left = current - delta;
                    let right = current + delta;
                    let range = [];
                    let rangeWithDots = [];
                    let l;

                    for (let i = 1; i <= last; i++) {
                        if (i === 1 || i === last || (i >= left && i <= right)) {
                            range.push(i);
                        }
                    }

                    for (let i of range) {
                        if (l) {
                            if (i - l === 2) {
                                rangeWithDots.push(l + 1);
                            } else if (i - l !== 1) {
                                rangeWithDots.push('...');
                            }
                        }
                        rangeWithDots.push(i);
                        l = i;
                    }

                    return rangeWithDots;
                },

                    const pendingCount = (proj || {}).pending_count || 0;
                    if (failedCount === 0 && pendingCount === 0) return;
                    if (!confirm(`Retry ${failedCount} FAIL + ${pendingCount} Wait trong dự án "${proj?.name || ''}"?`)) return;
                    this.retryingProject = true;
                    // Safety auto-unlock: nếu server không phản hồi trong 35s → tự mở khóa
                    const _safetyUnlock = setTimeout(() => { this.retryingProject = false; }, 35000);
                    try {
                        // Dùng fetch trực tiếp với AbortSignal (30s timeout)
                        const controller = new AbortController();
                        const _abortTimer = setTimeout(() => controller.abort(), 30000);
                        const res = await fetch(`${API_URL}/veo/project/${projectId}/retry-failed`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${localStorage.getItem('vietauto_apikey')}`,
                                'Content-Type': 'application/json'
                            },
                            signal: controller.signal,
                        });
                        clearTimeout(_abortTimer);
                        const d = await res.json();
                        if (!d.success) throw new Error(d.error || 'Retry thất bại');
                        this.showToast(`✓ Đã đưa ${d.data.retried} task vào hàng chờ thử lại!`, 'success');
                        await this.loadProjects();
                        await this.loadVideos();

                        if (err.name === 'AbortError') {
                            this.showToast('Timeout: Server chậm (>30s). Nhấn F5 rồi thử lại.', 'error');
                        } else {

                        this.retryingProject = false;

                    }
                },

                openVeoAccountCreateModal() {
                    this.veoAccountModal.isEdit = false;
                    this.veoAccountModal.data = { id: '', name: '', cookie: '', proxy: '', is_active: true };
                    this.veoAccountModal.isOpen = true;
                },

                openVeoAccountEditModal(acc) {
                    this.veoAccountModal.isEdit = true;
                    this.veoAccountModal.data = JSON.parse(JSON.stringify(acc));
                    this.veoAccountModal.isOpen = true;
                },

                closeVeoAccountModal() { this.veoAccountModal.isOpen = false; },

                async submitVeoAccountForm() {
                    this.veoAccountModal.loading = true;
                    try {
                        const payload = {
                            name: this.veoAccountModal.data.name,
                            cookie: this.veoAccountModal.data.cookie,
                            proxy: this.veoAccountModal.data.proxy,
                            static_proxy: this.veoAccountModal.data.static_proxy,
                            is_active: this.veoAccountModal.data.is_active
                        };
                        if (this.veoAccountModal.isEdit) {
                            await this.apiCall(`/veo/accounts/${this.veoAccountModal.data.id}`, 'PUT', payload);
                            this.showToast('Cập nhật Account thành công!');
                        } else {
                            await this.apiCall('/veo/accounts', 'POST', payload);
                            this.showToast('Thêm Account thành công!');
                        }
                        this.closeVeoAccountModal(); this.loadVeoAccounts();
                    } catch (err) { this.showToast(err.message, 'error'); }
                    finally { this.veoAccountModal.loading = false; }
                },

                async deleteVeoAccount(id) {
                    if (!confirm('Xác nhận xóa tài khoản Veo này (bao gồm cả Cookie & Proxy)?')) return;
                    this.deletingAccountId = id;
                    try {
                        await this.apiCall(`/veo/accounts/${id}`, 'DELETE');
                        this.showToast('✅ Đã xóa Account!', 'success');
                        this.loadVeoAccounts();
                        this.loadAccountActivities();
                    } catch (err) { this.showToast(err.message, 'error'); }
                    finally { this.deletingAccountId = null; }
                },

                async toggleVeoAccount(acc) {
                    this.togglingAccountId = acc.id;
                    try {
                        await this.apiCall(`/veo/accounts/${acc.id}`, 'PUT', { is_active: !acc.is_active });
                        acc.is_active = !acc.is_active;
                        this.showToast(acc.is_active ? `✅ Đã bật Account "${acc.name}"` : `⏸ Đã tắt Account "${acc.name}"`);
                        await this.loadVeoAccounts();
                        await this.loadAccountActivities();
                    } catch (err) { this.showToast(err.message, 'error'); }
                    finally { this.togglingAccountId = null; }
                },

                async unblockAccount(acc) {
                    try {
                        await this.apiCall(`/veo/accounts/${acc.id}/unblock`, 'POST');
                        acc.project_blacklisted = false;
                        this.showToast(`✅ Đã gỡ chặn Account "${acc.name}" — cho phép chạy lại bình thường`);
                        this.loadVeoAccounts();
                    } catch (err) { this.showToast(err.message, 'error'); }
                },

                async banAccountFromActivity(act) {
                    const newState = !act.is_active;
                    const action = newState ? 'BẬT' : 'BAN';
                    if (!newState && !confirm(`Xác nhận ${action} tài khoản "${act.name}"?\nTài khoản sẽ không được dùng để chạy request nữa.`)) return;
                    try {
                        await this.apiCall(`/veo/accounts/${act.account_id}`, 'PUT', { is_active: newState });
                        act.is_active = newState;
                        this.showToast(newState ? `✅ Đã bật lại Account "${act.name}"` : `🚫 Đã BAN Account "${act.name}" — không chạy request nữa`);
                        // Refresh data
                        await Promise.all([this.loadAccountActivities(), this.loadVeoAccounts()]);
                    } catch (err) { this.showToast(err.message, 'error'); }
                },

                async loadAccountActivities() {
                    try {
                        const data = await this.apiCall('/veo/accounts/activity');
                        this.accountActivities = data.accounts || [];
                        // Merge ban_reason + proxy_status vào veoAccounts cho bảng "Tài Khoản Có Vấn Đề"
                        const reasonMap = {};
                        const proxyStatusMap = {};
                        (data.accounts || []).forEach(a => {
                            if (a.ban_reason) reasonMap[a.name] = a.ban_reason;
                            if (a.proxy_status) proxyStatusMap[a.name] = a.proxy_status;
                        });
                        this.veoAccounts.forEach(acc => {
                            if (!acc.is_active && reasonMap[acc.name]) {
                                acc.ban_reason = reasonMap[acc.name];
                            }
                            acc._proxy_status = proxyStatusMap[acc.name] || 'unknown';
                        });
                    } catch (e) { /* silent */ }
                },

                async loadCaptchaStats() {
                    try {
                        this.captchaStats = await this.apiCall('/veo/accounts/captcha-stats');
                    } catch (e) { /* silent */ }
                },

                async loadAccountTokenMonitor() {
                    if (!this.isAdmin) return;
                    this.loadingAccountTokenMonitor = true;
                    try {
                        this.accountTokenRows = await this.apiCall('/veo/accounts');
                        this.$nextTick(() => this.renderAccountTokenGrid());
                    } catch (err) {
                        this.showToast('Không tải được token monitor: ' + err.message, 'error');
                    } finally {
                        this.loadingAccountTokenMonitor = false;
                    }
                },

                async resetAccountTokens() {
                    if (!this.isAdmin || this.resettingAccountTokens) return;
                    if (!confirm('Bạn chắc chắn muốn gỡ hết trạng thái token về Chưa call?')) return;
                    this.resettingAccountTokens = true;
                    try {
                        const data = await this.apiCall('/admin/account-tokens/reset', 'POST');
                        this.showToast(`Đã reset trạng thái token: ${data.modified || 0}/${data.matched || 0} account`, 'success');
                        await this.loadAccountTokenMonitor();
                    } catch (err) {
                        this.showToast('Reset trạng thái token lỗi: ' + err.message, 'error');
                    } finally {
                        this.resettingAccountTokens = false;
                    }
                },

                renderAccountTokenGrid() {
                    const mount = document.getElementById('account-token-grid');
                    if (!mount || typeof gridjs === 'undefined') return;
                    const rows = (this.accountTokenRows || []).map((acc) => [
                        gridjs.html(`<div class="text-left"><div class="font-black text-black text-sm leading-6">${this.escapeHtml(acc.name || '—')}</div><div class="text-[11px] text-slate-500 leading-5 tracking-wide">${acc.is_active ? 'Active' : 'Inactive'}</div></div>`),
                        gridjs.html(`<span class="inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-[11px] font-black tracking-wide leading-5 ${acc.api_session?.issued_at ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}"><i class="fa-solid ${acc.api_session?.issued_at ? 'fa-circle-check' : 'fa-clock'}"></i>${acc.api_session?.issued_at ? 'Đã call token' : 'Chưa call'}</span>`),
                        acc.api_session?.issued_to_username || '—',
                        gridjs.html(`<div class="text-left"><div class="text-sm font-bold text-black">${this.escapeHtml(acc.api_session?.project_name || 'API Session')}</div><div class="text-[11px] text-slate-500 font-mono">${this.escapeHtml(acc.api_session?.project_id || '')}</div></div>`),
                        this.formatTs(acc.api_session?.issued_at),
                        acc.api_session?.token_sha256 ? `${acc.api_session.token_sha256.slice(0, 12)}…` : '—',
                    ]);
                    const config = {
                        columns: [
                            { name: 'Account', width: '300px' },
                            { name: 'Trạng thái token', width: '180px' },
                            { name: 'User gọi', width: '150px' },
                            { name: 'Project', width: '260px' },
                            { name: 'Lần cấp gần nhất', width: '170px' },
                            { name: 'Token preview', width: '150px' },
                        ],
                        data: rows,
                        sort: true,
                        search: true,
                        pagination: { enabled: true, limit: 20 },
                        autoWidth: false,
                        className: { table: 'text-left text-black', th: 'text-left', td: 'text-left' },
                        language: { noRecordsFound: 'Không có dữ liệu phù hợp.', search: { placeholder: 'Tìm account, user, project...' } },
                    };
                    if (this.accountTokenGrid) {
                        this.accountTokenGrid.updateConfig(config).forceRender();
                    } else {
                        mount.innerHTML = '';
                        this.accountTokenGrid = new gridjs.Grid(config).render(mount);
                    }
                },

                get accountTokenStats() {
                    const rows = this.accountTokenRows || [];
                    const used = rows.filter(a => a.api_session && a.api_session.issued_at).length;
                    return {
                        total: rows.length,
                        used,
                        unused: rows.length - used,
                        active: rows.filter(a => a.is_active).length,
                    };
                },

                get filteredAccountTokenRows() {
                    const q = (this.accountTokenSearch || '').toLowerCase().trim();
                    return (this.accountTokenRows || []).filter(acc => {
                        const used = !!(acc.api_session && acc.api_session.issued_at);
                        if (this.accountTokenFilter === 'USED' && !used) return false;
                        if (this.accountTokenFilter === 'UNUSED' && used) return false;
                        if (!q) return true;
                        const haystack = [
                            acc.name,
                            acc.assigned_to_user_id,
                            acc.assigned_username,
                            acc.api_session?.username,
                            acc.api_session?.project_id,
                            acc.api_session?.project_name,
                        ].filter(Boolean).join(' ').toLowerCase();
                        return haystack.includes(q);
                    });
                },

                formatTs(ts) {
                    if (!ts) return '—';
                    const n = Number(ts);
                    const d = new Date(n > 1000000000000 ? n : n * 1000);
                    if (Number.isNaN(d.getTime())) return '—';
                    return d.toLocaleString('vi-VN');
                },

                async checkAllCookieHealth() {
                    if (!this.isAdmin || this.checkingHealth) return;
                    this.checkingHealth = true;
                    try {
                        const [cookieResults, proxyResp] = await Promise.all([
                            this.apiCall('/veo/accounts/check-all', 'POST'),
                            this.apiCall('/veo/accounts/check-proxy', 'POST').catch(() => ({ results: [] }))
                        ]);

                        // Cookie map
                        const cookieMap = {};
                        for (const r of cookieResults) { cookieMap[r.id] = r; }
                        this.cookieHealthMap = cookieMap;

                        // Proxy map
                        const proxyMap = {};
                        for (const r of (proxyResp.results || [])) { proxyMap[r.id] = r; }
                        this.proxyHealthMap = proxyMap;

                        // Toast summary
                        const expired = cookieResults.filter(r => r.status === 'expired').length;
                        const revoked = cookieResults.filter(r => r.status === 'revoked').length;
                        const invalid = cookieResults.filter(r => r.status === 'invalid').length;
                        const warning = cookieResults.filter(r => r.status === 'warning').length;
                        const deadProxy = (proxyResp.results || []).filter(r => r.alive === false).length;
                        const bad = expired + revoked + invalid;
                        if (bad > 0) this.showToast(`⚠ ${bad} cookie không dùng được (${expired} hết hạn, ${revoked} mất session). Thay ngay!`, 'error');
                        else if (deadProxy > 0) this.showToast(`⚠ ${deadProxy} proxy chết! Kiểm tra lại.`, 'error');
                        else if (warning > 0) this.showToast(`⚠ ${warning} cookie sắp hết hạn (≤ 3 ngày). Kiểm tra sớm.`, 'error');
                        else if (cookieResults.length > 0) this.showToast('✅ Tất cả cookie và proxy đang OK!', 'success');
                    } catch (err) {
                        this.showToast('Không thể kiểm tra: ' + err.message, 'error');
                    } finally { this.checkingHealth = false; }
                },

                async checkAllCredits() {
                    if (!this.isAdmin || this.checkingCredits) return;
                    this.checkingCredits = true;
                    try {
                        const results = await this.apiCall('/veo/accounts/check-credits', 'POST');
                        const cMap = {};
                        for (const r of results) { cMap[r.id] = r; }
                        this.creditsMap = cMap;
                        this.showToast(`💰 Đã kiểm tra credits cho ${results.length} tài khoản`, 'success');
                    } catch (err) {
                        this.showToast('Không thể kiểm tra credits: ' + err.message, 'error');
                    } finally { this.checkingCredits = false; }
                },

                // ---- COOKIE SYSTEM ----
                openCookieModal() {
                    this.cookieModal.data = '';
                    this.cookieModal.isOpen = true;
                },
                closeCookieModal() {
                    this.cookieModal.isOpen = false;
                },
                async submitCookieData() {
                    if (!this.cookieModal.data.trim()) return;
                    this.cookieModal.loading = true;
                    try {
                        await this.apiCall('/admin/settings/cookie', 'POST', { cookie: this.cookieModal.data });
                        this.showToast('Cập nhật Cookie Veo thành công! Đã reset service.');
                        this.closeCookieModal();
                    } catch (err) {
                        this.showToast(err.message, 'error');
                    } finally {
                        this.cookieModal.loading = false;
                    }
                }
            }));
        });
    </script>

</body>
