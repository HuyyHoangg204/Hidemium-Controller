                sidebarCollapsed ? 'w-[76px]' : 'w-[320px]'

                    <i class="fa-solid fa-shield-halved text-sm text-white"></i>
                </div>

                                :class="[
                                    activeMenu === item.key ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900',
                                    sidebarCollapsed ? 'justify-center px-2.5 py-3' : 'px-4 py-3'
                                ]"
                                :title="sidebarCollapsed ? item.label : ''">
                                <i class="fa-solid text-center w-6 text-xl shrink-0"
                                    :class="[item.icon, activeMenu === item.key ? 'text-white' : 'text-slate-400 group-hover:text-slate-600']"></i>
                                <span x-show="!sidebarCollapsed" x-text="item.label"></span>
                            </button>
                        </template>
                        <button @click="activeMenu = 'gallery'; mobileMenuOpen = false;"
                            class="w-full flex items-center gap-3 rounded-md font-medium text-[14px] transition-all duration-200 group"

                                activeMenu === 'gallery' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900',
                                sidebarCollapsed ? 'justify-center px-2.5 py-3' : 'px-4 py-3'
                            ]"
                            :title="sidebarCollapsed ? 'Kho ảnh cá nhân' : ''">
                            <i class="fa-solid fa-images text-center w-6 text-xl shrink-0"
                                :class="activeMenu === 'gallery' ? 'text-white' : 'text-slate-400 group-hover:text-slate-600'"></i>
                            <span x-show="!sidebarCollapsed">Kho ảnh cá nhân</span>
                        </button>
                    </div>
                </div>

                    <div>

                        <div class="space-y-1">
                            <button @click="activeMenu = 'users'; mobileMenuOpen = false;"
                                class="w-full flex items-center gap-3 rounded-md font-medium text-[14px] transition-all duration-200 group"
                                :class="[
                                    activeMenu === 'users' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900',
                                    sidebarCollapsed ? 'justify-center px-2.5 py-3' : 'px-4 py-3'
                                ]"
                                :title="sidebarCollapsed ? 'Quản lý Nhân sự' : ''">
                                <i class="fa-solid fa-users text-center w-6 text-xl shrink-0"
                                    :class="activeMenu === 'users' ? 'text-white' : 'text-slate-400 group-hover:text-slate-600'"></i>
                                <span x-show="!sidebarCollapsed">Quản lý Nhân sự (Dev/Admin)</span>
                            </button>
                            <button @click="activeMenu = 'veo_accounts'; loadVeoAccounts(); mobileMenuOpen = false;"
                                class="w-full flex items-center gap-3 rounded-md font-medium text-[14px] transition-all duration-200 group"
                                :class="[
                                    activeMenu === 'veo_accounts' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900',
                                    sidebarCollapsed ? 'justify-center px-2.5 py-3' : 'px-4 py-3'
                                ]"
                                :title="sidebarCollapsed ? 'Cookie & Proxy Pool' : ''">
                                <i class="fa-solid fa-shield-halved text-center w-6 text-xl shrink-0"

                                <span x-show="!sidebarCollapsed">Quản lý Cookie & Proxy Pool</span>
                            </button>
                            <button @click="activeMenu = 'account_tokens'; loadAccountTokenMonitor(); mobileMenuOpen = false;"
                                class="w-full flex items-center gap-3 rounded-md font-medium text-[14px] transition-all duration-200 group"
                                :class="[
                                    activeMenu === 'account_tokens' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900',
                                    sidebarCollapsed ? 'justify-center px-2.5 py-3' : 'px-4 py-3'
                                ]"
                                :title="sidebarCollapsed ? 'Token Usage' : ''">
                                <i class="fa-solid fa-key text-center w-6 text-xl shrink-0"
                                    :class="activeMenu === 'account_tokens' ? 'text-white' : 'text-slate-400 group-hover:text-slate-600'"></i>
                                <span x-show="!sidebarCollapsed">Theo dõi Token Account</span>
                            </button>
                            <button @click="activeMenu = 'job_results'; loadUserJobResults(); mobileMenuOpen = false;"
                                class="w-full flex items-center gap-3 rounded-md font-medium text-[14px] transition-all duration-200 group"
                                :class="[
                                    activeMenu === 'job_results' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900',
                                    sidebarCollapsed ? 'justify-center px-2.5 py-3' : 'px-4 py-3'
                                ]"
                                :title="sidebarCollapsed ? 'Job Results' : ''">

                                <span x-show="!sidebarCollapsed">Danh sách Job API</span>
                            </button>
                            <button @click="activeMenu = 'queue_monitor'; mobileMenuOpen = false;"

                                    activeMenu === 'queue_monitor' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900',
                                    sidebarCollapsed ? 'justify-center px-2.5 py-3' : 'px-4 py-3'
                                ]"
                                :title="sidebarCollapsed ? 'Giám Sát Queue' : ''">
                                <i class="fa-solid fa-chart-bar text-center w-6 text-xl shrink-0"
                                    :class="activeMenu === 'queue_monitor' ? 'text-white' : 'text-slate-400 group-hover:text-slate-600'"></i>
                                <span x-show="!sidebarCollapsed">Giám Sát Queue</span>
                            </button>
                            <button @click="activeMenu = 'machine_registry'; loadMachines(); mobileMenuOpen = false;"
                                class="w-full flex items-center gap-3 rounded-md font-medium text-[14px] transition-all duration-200 group"
                                :class="[
                                    activeMenu === 'machine_registry' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900',
                                    sidebarCollapsed ? 'justify-center px-2.5 py-3' : 'px-4 py-3'
                                ]"
                                :title="sidebarCollapsed ? 'Machine Registry' : ''">
                                <i class="fa-solid fa-server text-center w-6 text-xl shrink-0"
                                    :class="activeMenu === 'machine_registry' ? 'text-white' : 'text-slate-400 group-hover:text-slate-600'"></i>
                                <span x-show="!sidebarCollapsed">Machine Registry</span>
                            </button>

            <div class="px-3 py-2 border-t border-slate-100 hidden md:block">
                <button @click="sidebarCollapsed = !sidebarCollapsed"
                    class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition-all duration-200 text-[12px] font-semibold">
                    <i class="fa-solid transition-transform duration-300"
                        :class="sidebarCollapsed ? 'fa-angles-right' : 'fa-angles-left'"></i>
                    <span x-show="!sidebarCollapsed" x-transition.opacity class="whitespace-nowrap">Thu gọn</span>
                </button>
            </div>

            <div class="p-3 border-t border-slate-100 bg-slate-50/50"
                :class="sidebarCollapsed ? 'px-2' : 'p-4'">
                <div class="flex items-center bg-white border border-slate-200 rounded-lg p-2 shadow-sm"
                    :class="sidebarCollapsed ? 'justify-center' : 'justify-between'">
                    <div class="flex items-center gap-3 overflow-hidden pl-1" :class="sidebarCollapsed ? 'pl-0' : ''">
                        <div
                            class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm shrink-0">
                            <span x-text="currentUser?.username?.[0]?.toUpperCase()"></span>
                        </div>
                        <div x-show="!sidebarCollapsed" class="flex flex-col truncate">
                            <span class="text-sm font-bold text-slate-800 truncate" x-text="currentUser?.username"></span>
                            <span class="text-[11px] text-slate-400 uppercase font-bold tracking-wider" x-text="currentUser?.role"></span>
                        </div>

                    <button x-show="!sidebarCollapsed"
                        @click="localStorage.removeItem('vietauto_apikey'); isLoggedIn = false; currentUser = null; window.history.replaceState(null, null, '/login')"

                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </aside>
