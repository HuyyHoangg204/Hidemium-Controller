##########################################################################
# Nginx reverse-proxy config cho web
# Thay:
#   api.yourdomain.com   → domain thực tế của bạn
#   YOUR_VPS_IP          → IP VPS (nếu dùng IP trực tiếp thay domain)
##########################################################################

# Rate limiting: ngăn abuse (tối đa 30 req/s mỗi IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    # listen [::]:80;  # Uncomment nếu VPS hỗ trợ IPv6

    server_name api.yourdomain.com;

    # Chuyển hướng toàn bộ HTTP → HTTPS (sau khi đã cài SSL)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;

    server_name api.yourdomain.com;

    # ─── SSL Certificate (dùng certbot / Let's Encrypt) ───────────────────
    # Sau khi chạy: sudo certbot --nginx -d api.yourdomain.com
    # certbot sẽ tự điền dòng này:
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ─── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ─── Upload size ──────────────────────────────────────────────────────
    client_max_body_size 55M;   # Hơi lớn hơn Flask limit (50MB)

    # ─── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # ─── Proxy to Gunicorn ────────────────────────────────────────────────
    location / {
        # Rate limit (burst=50 cho phép đột biến ngắn 50 req)
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout phải match với gunicorn timeout (5 phút)
        proxy_connect_timeout  30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # ─── Static files (nếu có UI build) ──────────────────────────────────
    location /assets/ {
        alias /home/YOUR_USER/tool_veo_3/ui/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Healthcheck endpoint không cần rate limit ────────────────────────
    location /api/health {
        limit_req off;
        proxy_pass http://127.0.0.1:8080/api/health;
    }

    # ─── Logs ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/web.access.log;
    error_log  /var/log/nginx/web.error.log warn;
}
